<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi ProfesorIA - Resumen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles-shared.css">
    <link rel="stylesheet" href="../css/resumenes.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="resumenes">
    
    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <!-- Fondo con estrellas -->
    <div class="stars-background" id="starsBackground"></div>

    <main class="content">
        <!-- Header con navegación -->
        <div class="resumen-header">
            <button class="back-btn" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
                Volver
            </button>
            <div class="header-actions">
                <div class="favorite-wrapper">
                    <button class="action-btn favorite-btn" id="favoriteBtn" onclick="toggleFavorite()">
                        <i class="far fa-heart"></i>
                    </button>
                    <div class="sparkles-container" id="sparklesContainer"></div>
                </div>
            </div>
        </div>

        <!-- Estado: cargando -->
        <div class="loading-state" id="loadingState">
            <div class="loading-spinner">
                <i class="fas fa-circle-notch fa-spin"></i>
            </div>
            <p>Cargando resumen...</p>
        </div>

        <!-- Estado: error -->
        <div class="error-state" id="errorState" style="display:none;">
            <div class="error-icon">
                <i class="fas fa-triangle-exclamation"></i>
            </div>
            <h3 id="errorTitle">No se pudo cargar el resumen</h3>
            <p id="errorMessage">Ocurrió un error inesperado.</p>
            <button class="back-btn" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
                Regresar
            </button>
        </div>

        <!-- Card principal del resumen (se muestra cuando carga bien) -->
        <div class="resumen-card" id="resumenCard" style="display:none;">
            <!-- Título del tema -->
            <div class="resumen-title-section">
                <div class="title-icon">
                    <i class="fas fa-atom" id="titleIcon"></i>
                    <div class="icon-glow"></div>
                </div>
                <h1 class="resumen-title" id="resumenTitle">Cargando...</h1>
                <p class="resumen-meta">
                    <span><i class="fas fa-clock"></i> <span id="readTime">--</span> min lectura</span>
                    <span><i class="fas fa-calendar-alt"></i> <span id="createdAt">--</span></span>
                </p>
            </div>

            <!-- Contenido dinámico del resumen -->
            <div class="resumen-content" id="resumenContent">
                <!-- Se rellena desde JS -->
            </div>

            <!-- Sección de palabras clave -->
            <div class="keywords-section" id="keywordsSection" style="display:none;">
                <h3 class="keywords-title">
                    <i class="fas fa-key"></i>
                    Palabras clave
                </h3>
                <div class="keywords-container" id="keywordsContainer"></div>
            </div>

            <!-- Barra de acciones -->
            <div class="actions-bar">
                <button class="action-main-btn download-btn" id="downloadBtn" onclick="downloadPDF()">
                    <i class="fas fa-arrow-down-to-line"></i>
                    Descargar PDF
                </button>
            </div>
        </div>
    </main>

    <!-- Modal de descarga -->
    <div class="modal-overlay" id="downloadModal">
        <div class="modal download-modal">
            <div class="modal-icon download-icon">
                <i class="fas fa-file-pdf"></i>
                <div class="download-spinner"></div>
            </div>
            <h3 id="downloadTitle">Preparando descarga...</h3>
            <p id="downloadMessage">Tu PDF estará listo en un momento</p>
            <div class="download-bar">
                <div class="download-bar-fill" id="downloadBarFill"></div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle" id="toastIcon"></i>
        <span id="toastMessage">Acción completada</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/gamification.js"></script>
   <script src="../js/resumenes.js"></script>
</body>
</html>
