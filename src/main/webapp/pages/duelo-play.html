<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polaris - Duelo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles-shared.css">
    <link rel="stylesheet" href="../css/examen-experto.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        #rivalPanel {
            position: fixed;
            top: calc(var(--navbar-height, 65px) + 12px);
            right: 1.5rem;
            background: rgba(7,11,24,0.92);
            border: 1px solid rgba(45,212,191,0.25);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: .82rem;
            color: #94a3b8;
            z-index: 50;
            min-width: 130px;
            backdrop-filter: blur(10px);
            transition: opacity 0.2s;
        }
        #rivalPanel .rival-name {
            color: #2dd4bf;
            font-weight: 600;
            margin-bottom: 3px;
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 110px;
        }
        #rivalPanel .rival-score {
            color: #e2e8f0;
            font-size: 1rem;
            font-weight: 700;
        }
        #rivalPanel .rival-score span {
            color: #94a3b8;
            font-size: .72rem;
            font-weight: 400;
        }

        #waitingOverlay, #fatalOverlay {
            position: fixed;
            inset: 0;
            background: rgba(5,6,15,0.97);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            z-index: 999;
            font-family: inherit;
            color: #e2e8f0;
            text-align: center;
            padding: 0 1.5rem;
        }
        #fatalOverlay { display: none; z-index: 1000; }
        #waitingOverlay .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(45,212,191,0.2);
            border-top-color: #2dd4bf;
            border-radius: 50%;
            animation: ws-spin .8s linear infinite;
        }
        #waitingMsg {
            font-size: 1.1rem;
            color: #2dd4bf;
            letter-spacing: .05em;
            text-align: center;
            padding: 0 1.5rem;
        }
        @keyframes ws-spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            #rivalPanel {
                top: calc(var(--navbar-height, 65px) + 8px);
                right: 0.75rem;
                min-width: 110px;
                padding: 8px 10px;
                border-radius: 10px;
            }
            #rivalPanel .rival-name { font-size: 0.75rem; max-width: 90px; }
            #rivalPanel .rival-score { font-size: 0.9rem; }
            #waitingMsg { font-size: 0.95rem; }
        }

        @media (max-width: 480px) {
            #rivalPanel {
                top: calc(var(--navbar-height, 65px) + 6px);
                right: 0.5rem;
                min-width: 90px;
                padding: 6px 8px;
                border-radius: 8px;
            }
            #rivalPanel .rival-name { font-size: 0.7rem; max-width: 75px; }
            #rivalPanel .rival-score { font-size: 0.82rem; }
            #waitingOverlay .spinner { width: 38px; height: 38px; }
            #waitingMsg { font-size: 0.88rem; }
        }

        @media (max-width: 390px) {
            #rivalPanel { min-width: 80px; padding: 5px 7px; }
            #rivalPanel .rival-name { font-size: 0.65rem; max-width: 65px; }
            #rivalPanel .rival-score { font-size: 0.78rem; }
        }
    </style>
</head>
<body data-page="duelos">

    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <canvas id="starsCanvas"></canvas>
    <main class="content" style="padding: 0; overflow-x: hidden;">
    <div class="exam-wrapper" id="examWrapper" style="opacity:0;pointer-events:none;">
        <div class="exam-topbar">
            <div class="exam-topbar-left">
                <button class="btn-salir" onclick="confirmExit()"><i class="fas fa-arrow-left"></i> Salir</button>
                <div class="exam-title-bar"><i class="fas fa-bolt"></i><span id="duelTitle">Duelo</span></div>
                <div class="mode-badge-top"><i class="fas fa-trophy"></i><span>DUELO</span></div>
            </div>
            <div class="exam-topbar-right">
                <div class="question-counter"><span id="qCurrent">1</span> / <span id="qTotal">10</span></div>
                <div class="timer" id="timerBox"><i class="fas fa-clock"></i><span class="timer-value" id="timerDisplay">30</span></div>
            </div>
        </div>
        <div class="progress-container"><div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div></div>
        <div class="exam-screen" id="examScreen">
            <div class="question-area">
                <div class="question-card" id="questionCard">
                    <div class="question-number" id="qNumber">Pregunta 1</div>
                    <div class="question-text" id="qText"></div>
                    <div class="options-list" id="optionsList"></div>
                    <div class="nav-buttons">
                        <div class="question-dots" id="qDots"></div>
                        <button class="btn-nav btn-siguiente" id="btnNext" onclick="nextQuestion()" disabled>Siguiente <i class="fas fa-arrow-right"></i></button>
                    </div>
                </div>
            </div>
        </div>
        <div class="results-screen" id="resultsScreen">
            <div class="results-card">
                <h2 class="results-main-title" id="resultsTitle">¡Duelo completado!</h2>
                <p class="results-main-subtitle" id="resultsSubtitle"></p>
                <div class="grade-circle-wrapper"><div class="grade-circle">
                    <svg viewBox="0 0 160 160"><circle class="track" cx="80" cy="80" r="75"/><circle class="fill-circle" id="gradeCircle" cx="80" cy="80" r="75"/></svg>
                    <div class="grade-number" id="gradeNumber">0</div><div class="grade-label" id="gradeLabel">/ 10</div>
                </div></div>
                <div class="xp-earned" id="xpEarned" style="display:none;"><i class="fas fa-bolt"></i><span id="xpAmount"></span></div>
                <p class="grade-message" id="gradeMessage"></p>
                <div class="results-stats" id="resultsStats"></div>
                <div class="results-actions">
                    <button class="btn-result btn-retry" onclick="window.location.href='duelos.html'"><i class="fas fa-arrow-left"></i> Volver a Duelos</button>
                </div>
            </div>
        </div>
    </div>
    </main>

    <div class="modal-overlay" id="exitModal"><div class="modal">
        <div class="modal-icon exit"><i class="fas fa-door-open"></i></div>
        <h3>¿Salir del duelo?</h3><p>Si sales se contará como <span class="highlight">derrota</span>.</p>
        <div class="modal-actions"><button class="modal-btn cancel" onclick="closeExitModal()">Continuar</button><button class="modal-btn confirm-red" onclick="window.location.href='duelos.html'">Salir</button></div>
    </div></div>

    <!-- Overlay de espera -->
    <div id="waitingOverlay">
        <div class="spinner"></div>
        <div id="waitingMsg">Conectando...</div>
    </div>

    <!-- Overlay de error fatal — NO destruye el DOM del juego, solo lo cubre -->
    <div id="fatalOverlay">
        <i class="fas fa-exclamation-triangle" style="font-size:3rem;color:#fbbf24;"></i>
        <h2 style="margin:0;" id="fatalMsg"></h2>
        <a href="duelos.html" style="padding:12px 28px;background:#2dd4bf;color:#0f0f23;
            border-radius:12px;text-decoration:none;font-weight:600;">Ir a Duelos</a>
    </div>

    <script src="../js/components.js"></script>
    <script src="../js/gamification.js"></script>
    <script src="../js/marcos.js"></script>
    <script>
    const CTX = window.location.pathname.split('/pages')[0];
    function getUserId() { try { return JSON.parse(localStorage.getItem('user'))?.id || null; } catch(_) { return null; } }

    const params   = new URLSearchParams(window.location.search);
    const duelId   = params.get('duelId');
    const userId   = getUserId();
    const myUserId = userId;

    // La dirección del WebSocket se arma desde la página actual: mismo host, mismo
    // context path (CTX) y wss:// cuando la página va por HTTPS. Antes estaba fija a
    // ws://localhost:8080/project-1.0-SNAPSHOT/..., que dejó de existir cuando el WAR
    // pasó a desplegarse como ROOT, así que la conexión daba 404 siempre.
    const WS_PROTO = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const WS_URL   = `${WS_PROTO}//${window.location.host}${CTX}/ws/duelo/${duelId}`;
    let ws = null;
    let totalQ        = 0;
    let currentQ      = 0;
    let score         = 0;
    let timePerQ      = 30;
    let secondsLeft   = 30;
    let countdownInterval = null;
    let selectedIdx   = null;
    let questionStart = Date.now();
    let startTime     = Date.now();
    let players       = {};

    // ── Helper seguro: nunca crashea si el elemento no existe ──
    function setText(id, value) {
        const el = document.getElementById(id);
        if (el) el.textContent = value;
        else console.warn('[duelo-play] Elemento no encontrado:', id);
    }
    function setHtml(id, value) {
        const el = document.getElementById(id);
        if (el) el.innerHTML = value;
        else console.warn('[duelo-play] Elemento no encontrado:', id);
    }
    function setStyle(id, prop, value) {
        const el = document.getElementById(id);
        if (el) el.style[prop] = value;
    }

    // showFatal ya NO destruye el DOM del juego — solo muestra un overlay encima.
    // Así, si llega un mensaje tardío del servidor (QUESTION, TIMEOUT, etc.)
    // después de un error, los elementos siguen existiendo y no crashea.
    function showFatal(msg) {
        hideWaiting();
        setText('fatalMsg', msg);
        const overlay = document.getElementById('fatalOverlay');
        if (overlay) overlay.style.display = 'flex';
    }

    if (!duelId || !userId) {
        showFatal('Faltan datos del duelo. Volvé a la página de duelos.');
    }

    function showWaiting(msg) {
        const overlay = document.getElementById('waitingOverlay');
        const msgEl   = document.getElementById('waitingMsg');
        if (overlay) overlay.style.display = 'flex';
        if (msgEl)   msgEl.textContent = msg;
        const wrapper = document.getElementById('examWrapper');
        if (wrapper) { wrapper.style.opacity = '0'; wrapper.style.pointerEvents = 'none'; }
    }

    function hideWaiting() {
        const overlay = document.getElementById('waitingOverlay');
        if (overlay) overlay.style.display = 'none';
        const wrapper = document.getElementById('examWrapper');
        if (wrapper) { wrapper.style.opacity = '1'; wrapper.style.pointerEvents = 'auto'; }
    }

    // Estado de la conexión: hay que distinguir la primera entrada (JOIN) de una
    // reconexión (RECONNECT), y no reconectar cuando el duelo ya terminó.
    let yaEntro            = false;
    let duelTerminado      = false;
    let intentosReconexion = 0;
    const MAX_REINTENTOS   = 5;

    function connect() {
        ws = new WebSocket(WS_URL);
        ws.onopen = () => {
            console.log('[WS] Conectado');
            intentosReconexion = 0;
            if (yaEntro) {
                // Reconexión: el servidor responde con STATE_SYNC y seguimos donde íbamos.
                send({ type: 'RECONNECT', duelId, userId });
                showWaiting('Reconectando...');
            } else {
                yaEntro = true;
                send({ type: 'JOIN', duelId, userId });
                showWaiting('Conectando...');
            }
        };
        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            console.log('[WS] ←', msg.type, msg);
            handleMessage(msg);
        };
        ws.onclose = (e) => {
            console.warn('[WS] Cerrado', e.code);
            if (e.code === 1000 || duelTerminado) return;
            reconnect();
        };
        ws.onerror = (e) => console.error('[WS] Error', e);
    }

    function send(msg) {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
    }

    // Antes esto mandaba RECONNECT por el socket que se acababa de cerrar, así que
    // send() lo descartaba por readyState y la reconexión nunca llegaba a ocurrir.
    // Hay que abrir una conexión nueva; el RECONNECT se manda desde onopen.
    function reconnect() {
        if (duelTerminado) return;
        if (intentosReconexion >= MAX_REINTENTOS) {
            showFatal('Se perdió la conexión con el duelo. Volvé a la página de duelos.');
            return;
        }
        intentosReconexion++;
        showWaiting(`Reconectando... (intento ${intentosReconexion} de ${MAX_REINTENTOS})`);
        setTimeout(connect, 2000);
    }

    function handleMessage(msg) {
        switch (msg.type) {
            case 'WAITING':        showWaiting(msg.message); break;
            case 'READY':          onReady(msg); break;
            case 'QUESTION':       onQuestion(msg); break;
            case 'ANSWER_RESULT':  onAnswerResult(msg); break;
            case 'SCORE_UPDATE':   onScoreUpdate(msg); break;
            case 'GAME_OVER':      onGameOver(msg); break;
            case 'TIMEOUT':        onTimeout(msg); break;
            case 'OPPONENT_LEFT':  showWaiting(`Tu oponente se desconectó. Esperando (${msg.graceSecs}s)...`); break;
            case 'STATE_SYNC':     onStateSync(msg); break;
            case 'INFO':           console.info('[WS]', msg.message); break;
            case 'ERROR':          console.error('[WS] ERROR del servidor:', msg.message); showFatal(msg.message); break;
        }
    }

    function onReady(msg) {
        totalQ   = msg.totalQuestions;
        timePerQ = msg.timePerQuestion || 30;
        players  = {};
        msg.players.forEach(p => { players[p.userId] = p; });

        setText('qTotal', totalQ);
        setText('duelTitle', 'Duelo en vivo');
        setHtml('qDots', Array.from({length: totalQ}, (_, i) =>
            `<div class="q-dot ${i === 0 ? 'current' : ''}" id="dot-${i}"></div>`).join(''));

        const rival = Object.values(players).find(p => p.userId !== myUserId);
        if (rival) updateRivalPanel(rival.username, 0);
        initStars();
        startTime = Date.now();
    }

    function onQuestion(msg) {
        hideWaiting();
        currentQ      = msg.index;
        timePerQ      = msg.timeLimit || timePerQ;
        selectedIdx   = null;
        questionStart = Date.now();

        setText('qNumber', `Pregunta ${currentQ + 1}`);
        setText('qCurrent', currentQ + 1);
        setText('qText', msg.text || msg.question || '');
        setStyle('progressFill', 'width', `${((currentQ + 1) / totalQ) * 100}%`);

        const opts = msg.options || [];
        setHtml('optionsList', opts.map((opt, i) =>
            `<button class="option-btn" onclick="selectOption(${i}, this)">
                <span class="option-letter">${String.fromCharCode(65 + i)}</span>
                <span class="option-text">${opt}</span>
            </button>`).join(''));

        document.querySelectorAll('.q-dot').forEach((d, i) => d.classList.toggle('current', i === currentQ));

        const btn = document.getElementById('btnNext');
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = currentQ < totalQ - 1
                ? 'Siguiente <i class="fas fa-arrow-right"></i>'
                : '<i class="fas fa-flag-checkered"></i> Finalizar';
        }

        startCountdown();
    }

    function onAnswerResult(msg) {
        const correct       = msg.correct;
        const correctIdx    = msg.correctIdx;
        const yourAnswerIdx = msg.yourAnswerIdx;

        document.querySelectorAll('.option-btn').forEach((btn, i) => {
            btn.style.pointerEvents = 'none';
            const letter = btn.querySelector('.option-letter');
            if (i === correctIdx) {
                btn.style.borderColor   = 'var(--accent-green)';
                btn.style.background    = 'rgba(34,197,94,0.15)';
                if (letter) { letter.style.background = 'var(--accent-green)'; letter.style.color = '#0f0f23'; }
            }
            if (i === yourAnswerIdx && !correct) {
                btn.style.borderColor   = 'var(--accent-red)';
                btn.style.background    = 'rgba(239,68,68,0.15)';
                if (letter) { letter.style.background = 'var(--accent-red)'; letter.style.color = '#fff'; }
            }
        });

        if (correct) score++;
    }

    function onScoreUpdate(msg) {
        const rivalId = msg.userId;
        if (rivalId && rivalId !== myUserId && players[rivalId]) {
            updateRivalPanel(players[rivalId].username, msg.score);
        }
    }

    function onTimeout(msg) {
        clearInterval(countdownInterval);
        if (selectedIdx === null) {
            selectedIdx = -1;
            document.querySelectorAll('.option-btn').forEach(btn => btn.style.pointerEvents = 'none');
        }
    }

    function onGameOver(msg) {
        clearInterval(countdownInterval);
        hideWaiting();
        duelTerminado = true;   // corta cualquier reintento de reconexión
        if (ws) ws.close(1000);
        showResults(msg, Math.floor((Date.now() - startTime) / 1000));
    }

    function onStateSync(msg) {
        currentQ = msg.currentQuestion;
        totalQ   = msg.totalQuestions;
        score    = msg.myScore || 0;
    }

    function updateRivalPanel(username, rivalScore) {
        let panel = document.getElementById('rivalPanel');
        if (!panel) {
            panel = document.createElement('div');
            panel.id = 'rivalPanel';
            document.body.appendChild(panel);
        }
        panel.innerHTML = `
            <div class="rival-name"><i class="fas fa-user" style="font-size:.7rem;margin-right:4px;"></i>${username}</div>
            <div class="rival-score">${rivalScore} <span>puntos</span></div>`;
    }

    function startCountdown() {
        secondsLeft = timePerQ;
        updateTimerDisplay();
        const timerBox = document.getElementById('timerBox');
        if (timerBox) timerBox.classList.remove('warning', 'danger');
        clearInterval(countdownInterval);
        countdownInterval = setInterval(() => {
            secondsLeft--;
            updateTimerDisplay();
            if (timerBox) {
                if (secondsLeft <= 5)       { timerBox.classList.add('danger'); timerBox.classList.remove('warning'); }
                else if (secondsLeft <= 10) { timerBox.classList.add('warning'); }
            }
            if (secondsLeft <= 0) { clearInterval(countdownInterval); autoSubmitTimeout(); }
        }, 1000);
    }

    function updateTimerDisplay() {
        setText('timerDisplay', Math.max(0, secondsLeft));
    }

    function autoSubmitTimeout() {
        if (selectedIdx !== null) return;
        selectedIdx = -1;
        document.querySelectorAll('.option-btn').forEach(btn => btn.style.pointerEvents = 'none');
        send({ type: 'ANSWER', questionIndex: currentQ, answerIdx: -1, timeSecs: timePerQ });
    }

    function selectOption(idx, el) {
        if (selectedIdx !== null) return;
        selectedIdx = idx;
        clearInterval(countdownInterval);
        const timeSecs = Math.round((Date.now() - questionStart) / 1000);

        document.querySelectorAll('.option-btn').forEach((btn, i) => {
            btn.style.pointerEvents = 'none';
            if (i === idx) {
                btn.style.borderColor = 'var(--accent-cyan)';
                btn.style.background  = 'rgba(45,212,191,0.15)';
            }
        });

        const dot = document.getElementById(`dot-${currentQ}`);
        if (dot) dot.classList.add('answered');
        const btn = document.getElementById('btnNext');
        if (btn) btn.disabled = false;

        send({ type: 'ANSWER', questionIndex: currentQ, answerIdx: idx, timeSecs });
    }

    function nextQuestion() {
        // El servidor controla el avance
    }

    function showResults(msg, totalTime) {
        const examScreen    = document.getElementById('examScreen');
        const resultsScreen = document.getElementById('resultsScreen');
        if (examScreen)    examScreen.classList.add('hidden');
        if (resultsScreen) resultsScreen.classList.add('active');

        const panel = document.getElementById('rivalPanel');
        if (panel) panel.style.display = 'none';

        const finalScores = msg.finalScores || {};
        const myScore     = finalScores[myUserId] ?? score;
        const rivalId     = Object.keys(finalScores).find(id => id !== myUserId);
        const rivalScore  = rivalId ? finalScores[rivalId] : 0;
        const total       = totalQ || 1;
        const winnerId    = msg.winner;
        const isWin       = winnerId === myUserId;
        const isDraw      = winnerId === 'draw';
        const isAbandoned = msg.reason === 'opponent_abandoned';

        const title = document.getElementById('resultsTitle');
        const sub   = document.getElementById('resultsSubtitle');

        if (title && sub) {
            if (isAbandoned)  { title.textContent = '🏆 ¡Victoria!'; title.style.color = 'var(--accent-yellow)'; sub.textContent = 'Tu oponente abandonó.'; }
            else if (isDraw)  { title.textContent = '🤝 Empate';     title.style.color = 'var(--accent-cyan)';   sub.textContent = `Ambos: ${myScore}/${total}`; }
            else if (isWin)   { title.textContent = '🏆 ¡Victoria!'; title.style.color = 'var(--accent-yellow)'; sub.textContent = `Rival: ${rivalScore}/${total}`; }
            else              { title.textContent = '😞 Derrota';    title.style.color = 'var(--accent-red)';    sub.textContent = `Rival: ${rivalScore}/${total}`; }
        }

        const pct    = (myScore / total) * 100;
        const circ   = 2 * Math.PI * 75;
        const offset = circ - (circ * pct / 100);
        const circle = document.getElementById('gradeCircle');
        if (circle) {
            circle.style.stroke = pct >= 80 ? 'var(--accent-green)' : pct >= 50 ? 'var(--accent-yellow)' : 'var(--accent-red)';
            setTimeout(() => { circle.style.strokeDashoffset = offset; }, 200);
        }
        setText('gradeNumber', myScore);
        setText('gradeLabel', `/ ${total}`);

        const m = Math.floor(totalTime / 60), s = totalTime % 60;
        setHtml('resultsStats', `
            <div class="stat-card"><div class="stat-card-icon" style="background:rgba(34,197,94,0.2);color:var(--accent-green)"><i class="fas fa-check"></i></div><div class="stat-card-value">${myScore}</div><div class="stat-card-label">Correctas</div></div>
            <div class="stat-card"><div class="stat-card-icon" style="background:rgba(239,68,68,0.2);color:var(--accent-red)"><i class="fas fa-times"></i></div><div class="stat-card-value">${total - myScore}</div><div class="stat-card-label">Incorrectas</div></div>
            <div class="stat-card"><div class="stat-card-icon" style="background:rgba(45,212,191,0.2);color:var(--accent-cyan)"><i class="fas fa-clock"></i></div><div class="stat-card-value">${m}:${String(s).padStart(2,'0')}</div><div class="stat-card-label">Tiempo</div></div>
            <div class="stat-card"><div class="stat-card-icon" style="background:rgba(251,191,36,0.2);color:var(--accent-yellow)"><i class="fas fa-trophy"></i></div><div class="stat-card-value">${rivalScore}</div><div class="stat-card-label">Rival</div></div>`);

        if (msg.xpEarned > 0 || msg.coinsEarned > 0) {
            const xpEl = document.getElementById('xpEarned');
            if (xpEl) xpEl.style.display = 'flex';
            setText('xpAmount', `+${msg.xpEarned} XP · +${msg.coinsEarned} monedas`);
        }

        try {
            const u = JSON.parse(localStorage.getItem('user')) || {};
            if (!u.stats) u.stats = {};
            if (msg.newLevel) u.stats.level = msg.newLevel;
            localStorage.setItem('user', JSON.stringify(u));
        } catch(_) {}
    }

    function confirmExit()    { const m = document.getElementById('exitModal'); if (m) m.classList.add('show'); }
    function closeExitModal() { const m = document.getElementById('exitModal'); if (m) m.classList.remove('show'); }
    document.querySelectorAll('.modal-overlay').forEach(m =>
        m.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); })
    );

    function initStars() {
        const c = document.getElementById('starsCanvas'); if (!c) return;
        const ctx = c.getContext('2d');
        c.width = window.innerWidth; c.height = window.innerHeight;
        const stars = Array.from({length: 150}, () => ({
            x: Math.random() * c.width, y: Math.random() * c.height,
            r: Math.random() * 1.5 + 0.3, o: Math.random() * 0.5 + 0.1,
            d: (Math.random() - 0.5) * 0.01
        }));
        function draw() {
            ctx.clearRect(0, 0, c.width, c.height);
            stars.forEach(s => {
                s.o += s.d; if (s.o < 0.05 || s.o > 0.6) s.d *= -1;
                ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(200,180,255,${s.o})`; ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        draw();
        window.addEventListener('resize', () => { c.width = window.innerWidth; c.height = window.innerHeight; });
    }

    if (duelId && userId) setTimeout(connect, 300);
    </script>
</body>
