<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi ProfesorIA - Sesión de Estudio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles-shared.css">
    <link rel="stylesheet" href="../css/sesion-estudio.css">
    <style>
        /* Schema container */
        .se-schema-svg-wrap { width:100%; margin:0 auto; padding:16px 0; }
        .se-schema-svg-wrap svg { display:block; width:100%; height:auto; }
        .se-schema-svg-wrap svg text { font-family:'Segoe UI',system-ui,sans-serif; }

        /* Tree container — centrado y más grande */
        .se-tree-container {
            width:100% !important;
            max-width:100% !important;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:24px 16px;
        }
        .se-panel-inner {
            width:100% !important;
            max-width:100% !important;
        }

        /* Fullscreen overlay */
        .fs-overlay {
            position:fixed; top:0; left:0; right:0; bottom:0;
            background:var(--primary-bg, #0f0f23);
            z-index:2000; display:none; flex-direction:column;
        }
        .fs-overlay.active { display:flex; }
        .fs-header {
            display:flex; align-items:center; justify-content:space-between;
            padding:12px 20px; background:rgba(26,26,53,0.95);
            border-bottom:1px solid rgba(139,92,246,0.2); flex-shrink:0;
        }
        .fs-close-btn {
            background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.4);
            color:#f87171; padding:8px 16px; border-radius:10px; cursor:pointer;
            font-family:inherit; font-size:0.9rem; transition:all 0.3s;
        }
        .fs-close-btn:hover { background:rgba(239,68,68,0.3); }
        .fs-title { color:#fff; font-size:1.1rem; }
        .fs-zoom { display:flex; align-items:center; gap:8px; }
        .fs-zoom button {
            background:rgba(139,92,246,0.15); border:1px solid rgba(139,92,246,0.3);
            color:#a78bfa; width:34px; height:34px; border-radius:8px; cursor:pointer;
            font-size:0.85rem; transition:all 0.3s;
        }
        .fs-zoom button:hover { background:rgba(139,92,246,0.3); }
        .fs-zoom span { color:rgba(255,255,255,0.5); font-size:0.8rem; min-width:40px; text-align:center; }
        .fs-body {
            flex:1; overflow:auto; display:flex; align-items:center; justify-content:center;
            padding:20px;
        }
        .fs-body .se-schema-svg-wrap { max-width:none; transition:transform 0.2s ease; }
    </style>
</head>
<body data-page="modo-estudio">

    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <!-- ================================================================
         PANTALLA DE CARGA (visible mientras genera)
    ================================================================ -->
    <div class="loading-screen" id="loadingScreen">
        <canvas id="loadingStars"></canvas>
        <div class="loading-content">
            <div class="loading-logo">
                <img src="../images/modo-estudio/modo-estudio-logo.png" alt="Modo Estudio">
            </div>
            <div class="loading-orb">
                <div class="loading-orb-ring r1"></div>
                <div class="loading-orb-ring r2"></div>
                <div class="loading-orb-ring r3"></div>
                <div class="loading-orb-core">
                    <i class="fas fa-brain"></i>
                </div>
            </div>
            <div class="loading-title">Generando tu sesión de estudio</div>
            <div class="loading-subtitle" id="loadingSubtitle">Analizando tu contenido...</div>
            <div class="loading-progress-bar">
                <div class="loading-progress-fill" id="loadingProgressFill"></div>
            </div>
            <div class="loading-steps" id="loadingSteps"></div>
        </div>
    </div>

    <!-- ================================================================
         PANTALLA DE RESULTADOS (visible después de generar)
    ================================================================ -->
    <main class="content" id="mainContent" style="display:none;">
        <canvas id="starsCanvas"></canvas>

        <!-- Header de la sesión -->
        <div class="se-header">
            <div class="se-header-left">
                <a href="../pages/modo-estudio.html" class="se-back-link">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <div>
                    <div class="se-title" id="seTitle">Sesión de Estudio</div>
                    <div class="se-meta" id="seMeta">4 tipos de contenido generados</div>
                </div>
            </div>
            <div class="se-session-badge">
                <i class="fas fa-check-circle"></i> Listo
            </div>
        </div>

        <!-- Tabs de navegación -->
        <div class="se-tabs" id="seTabs"></div>

        <!-- Contenido de cada tab -->
        <div class="se-panels" id="sePanels"></div>
    </main>

    <!-- Fullscreen overlay para esquemas -->
    <div class="fs-overlay" id="fsOverlay">
        <div class="fs-header">
            <button class="fs-close-btn" onclick="closeFullscreen()">
                <i class="fas fa-times"></i> Cerrar
            </button>
            <div class="fs-title" id="fsTitle">Esquema</div>
            <div class="fs-zoom">
                <button onclick="fsZoom(-0.15)"><i class="fas fa-search-minus"></i></button>
                <span id="fsZoomLevel">100%</span>
                <button onclick="fsZoom(0.15)"><i class="fas fa-search-plus"></i></button>
                <button onclick="fsZoomReset()"><i class="fas fa-compress-arrows-alt"></i></button>
            </div>
        </div>
        <div class="fs-body" id="fsBody"></div>
    </div>

    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Listo</span>
    </div>

    <script src="../js/components.js"></script>
    <script>
    // ================================================================
    // CONFIGURACIÓN DE MÓDULOS
    // ================================================================
    const MODULE_CONFIG = {
        flashcards: {
            label:    'Flashcards',
            icon:     'fa-layer-group',
            color:    '#2dd4bf',
            studyUrl: '../pages/flashcards.html',
            btnLabel: 'Estudiar flashcards',
            btnIcon:  'fa-play'
        },
        esquemas: {
            label:    'Esquema',
            icon:     'fa-project-diagram',
            color:    '#8b5cf6',
            studyUrl: null, // se renderiza aquí directamente
            btnLabel: 'Ver esquema completo',
            btnIcon:  'fa-expand'
        },
        examenes: {
            label:    'Examen',
            icon:     'fa-file-signature',
            color:    '#f59e0b',
            studyUrl: null, // depende del tipo (quiz o expert_exam)
            btnLabel: 'Iniciar examen',
            btnIcon:  'fa-bolt'
        },
        resumenes: {
            label:    'Resumen',
            icon:     'fa-file-alt',
            color:    '#ec4899',
            studyUrl: null, // se muestra inline
            btnLabel: 'Leer completo',
            btnIcon:  'fa-book-open'
        }
    };

    let flow    = null;
    let results = null;
    let activeTab = null;

    // ================================================================
    // FLOW MANAGER
    // ================================================================
    function getFlow() { return JSON.parse(sessionStorage.getItem('modoEstudioFlow') || 'null'); }

    // ================================================================
    // INIT — empieza en pantalla de carga, luego llama al servlet
    // ================================================================
    document.addEventListener('DOMContentLoaded', async () => {
        flow = getFlow();

        // Si viene desde favoritos/historial, mostrar directo sin generar
        const fromHistorial = sessionStorage.getItem('fromHistorial');
        if (fromHistorial === 'true') {
            sessionStorage.removeItem('fromHistorial');
            results = JSON.parse(sessionStorage.getItem('studyResults') || '{}');
            if (!flow) flow = { userId: null, options: Object.keys(results), configs: {} };
            // Ocultar loading y mostrar resultados directo
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            initResultStars();
            buildUI(flow, results);
            return;
        }

        if (!flow || !flow.userId) {
            window.location.href = '../pages/modo-estudio.html';
            return;
        }

        initLoadingStars();
        renderLoadingSteps(flow.options);

        try {
            results = await generateSession(flow);
            sessionStorage.setItem('studyResults', JSON.stringify(results));
            await simulateFinish(); // pequeña pausa visual
            showResults(flow, results);
        } catch (err) {
            console.error('Error generando sesión:', err);
            showError(err.message);
        }
    });

    // ================================================================
    // LLAMADA AL SERVLET
    // ================================================================
    async function generateSession(flow) {
        let requestInit;

        if (flow.dataType === 'file' && flow.fileBase64) {
            // Reconstruir archivo desde base64 y enviar como multipart
            const [meta, data] = flow.fileBase64.split(',');
            const mime = meta.match(/:(.*?);/)[1];
            const binary = atob(data);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const blob = new Blob([bytes], { type: mime });

            const formData = new FormData();
            formData.append('file',    blob, flow.fileName || 'archivo');
            formData.append('userId',  flow.userId);
            formData.append('options', JSON.stringify(flow.options));
            formData.append('configs', JSON.stringify(flow.configs || {}));
            requestInit = { method: 'POST', body: formData };
        } else {
            requestInit = {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({
                    userId:  flow.userId,
                    options: flow.options,
                    text:    flow.text,
                    configs: flow.configs
                })
            };
        }

        const response = await fetch('/project-1.0-SNAPSHOT/modo-estudio/generar', requestInit);

        if (!response.ok) throw new Error(`Error del servidor: ${response.status}`);
        const data = await response.json();
        if (!data.success) throw new Error(data.error || 'Error al generar contenido');
        return data.results;
    }

    // ================================================================
    // PANTALLA DE CARGA
    // ================================================================
    const STEP_LABELS = {
        flashcards: { label: 'Generando flashcards',  icon: 'fa-layer-group'    },
        esquemas:   { label: 'Creando esquema',        icon: 'fa-project-diagram'},
        examenes:   { label: 'Preparando examen',      icon: 'fa-file-signature' },
        resumenes:  { label: 'Redactando resumen',     icon: 'fa-file-alt'       }
    };

    function renderLoadingSteps(options) {
        const container = document.getElementById('loadingSteps');
        container.innerHTML = options.map(opt => `
            <div class="loading-step" id="lstep-${opt}">
                <div class="loading-step-icon"><i class="fas ${STEP_LABELS[opt]?.icon || 'fa-star'}"></i></div>
                <div class="loading-step-label">${STEP_LABELS[opt]?.label || opt}</div>
                <div class="loading-step-status" id="lstatus-${opt}">
                    <div class="loading-dot-spin"></div>
                </div>
            </div>
        `).join('');

        // Animar los pasos uno por uno
        let delay = 0;
        options.forEach(opt => {
            setTimeout(() => {
                document.getElementById('lstep-' + opt)?.classList.add('active');
                const subtitles = { flashcards:'Creando tarjetas de estudio...', esquemas:'Construyendo el esquema...', examenes:'Formulando las preguntas...', resumenes:'Redactando el resumen...' };
                document.getElementById('loadingSubtitle').textContent = subtitles[opt] || 'Procesando...';
                // Actualizar barra de progreso
                const pct = Math.round(((options.indexOf(opt) + 1) / options.length) * 85);
                document.getElementById('loadingProgressFill').style.width = pct + '%';
            }, delay);
            delay += 1800;
        });
    }

    function simulateFinish() {
        return new Promise(resolve => {
            document.getElementById('loadingSubtitle').textContent = '¡Todo listo!';
            document.getElementById('loadingProgressFill').style.width = '100%';
            // Marcar todos como completos
            document.querySelectorAll('.loading-step').forEach(s => {
                s.classList.add('done');
                const id = s.id.replace('lstep-', '');
                const st = document.getElementById('lstatus-' + id);
                if (st) st.innerHTML = '<i class="fas fa-check" style="color:#2dd4bf"></i>';
            });
            setTimeout(resolve, 800);
        });
    }

    function showError(msg) {
        document.getElementById('loadingSubtitle').textContent = 'Error: ' + msg;
        document.getElementById('loadingProgressFill').style.background = '#ef4444';
    }

    // ================================================================
    // PANTALLA DE RESULTADOS
    // ================================================================
    function showResults(flow, results) {
        // Ocultar loading, mostrar resultados
        document.getElementById('loadingScreen').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            initResultStars();
            buildUI(flow, results);
        }, 400);
    }

    function buildUI(flow, results) {
        // Header
        const successCount = flow.options.filter(o => results[o] && !results[o].error).length;
        document.getElementById('seTitle').textContent = results[flow.options[0]]?.title || 'Sesión de Estudio';
        document.getElementById('seMeta').textContent = `${successCount} ${successCount === 1 ? 'tipo generado' : 'tipos generados'} correctamente`;

        // Tabs
        const tabsEl   = document.getElementById('seTabs');
        const panelsEl = document.getElementById('sePanels');
        tabsEl.innerHTML = '';
        panelsEl.innerHTML = '';

        let firstTab = null;
        flow.options.forEach(opt => {
            const cfg = MODULE_CONFIG[opt];
            if (!cfg) return;
            const hasError = results[opt]?.error;

            // Tab
            const tab = document.createElement('div');
            tab.className = 'se-tab';
            tab.id = 'tab-' + opt;
            tab.innerHTML = `
                <i class="fas ${cfg.icon}"></i>
                <span>${cfg.label}</span>
                ${hasError ? '<span class="se-tab-err"><i class="fas fa-exclamation"></i></span>' : ''}
            `;
            tab.onclick = () => switchTab(opt);
            tab.style.setProperty('--tab-color', cfg.color);
            tabsEl.appendChild(tab);

            // Panel
            const panel = document.createElement('div');
            panel.className = 'se-panel';
            panel.id = 'panel-' + opt;
            panel.innerHTML = hasError
                ? buildErrorPanel(opt, results[opt].error)
                : buildPanel(opt, results[opt], flow.configs[opt]);
            panelsEl.appendChild(panel);

            if (!firstTab) firstTab = opt;
        });

        if (firstTab) switchTab(firstTab);
    }

    function switchTab(opt) {
        activeTab = opt;
        document.querySelectorAll('.se-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.se-panel').forEach(p => p.classList.remove('active'));
        document.getElementById('tab-' + opt)?.classList.add('active');
        document.getElementById('panel-' + opt)?.classList.add('active');
    }

    // ================================================================
    // BUILDERS DE PANELES
    // ================================================================
    function buildPanel(opt, data, config) {
        switch (opt) {
            case 'flashcards': return buildFlashcardsPanel(data);
            case 'esquemas':   return buildEsquemasPanel(data, config);
            case 'examenes':   return buildExamenesPanel(data, config);
            case 'resumenes':  return buildResumenPanel(data);
            default:           return `<p>Contenido no disponible</p>`;
        }
    }

    function buildErrorPanel(opt, error) {
        return `
            <div class="se-error-panel">
                <i class="fas fa-exclamation-triangle"></i>
                <div class="se-error-title">Error generando ${MODULE_CONFIG[opt]?.label}</div>
                <div class="se-error-msg">${error}</div>
                <button class="se-action-btn secondary" onclick="window.location.href='../pages/modo-estudio.html'">
                    <i class="fas fa-redo"></i> Volver a intentar
                </button>
            </div>
        `;
    }

    // — Flashcards —
    function buildFlashcardsPanel(data) {
        const cards = data.cards || [];
        const preview = cards.slice(0, 3).map(c => `
            <div class="se-fc-preview-card">
                <div class="se-fc-front">${c.front}</div>
                <div class="se-fc-divider"><i class="fas fa-arrow-down"></i></div>
                <div class="se-fc-back">${c.back}</div>
            </div>
        `).join('');

        return `
            <div class="se-panel-inner">
                <div class="se-panel-stats">
                    <div class="se-stat"><span class="se-stat-val">${cards.length}</span><span class="se-stat-lbl">tarjetas</span></div>
                    <div class="se-stat"><span class="se-stat-val">${data.title ? '✓' : '—'}</span><span class="se-stat-lbl">tema</span></div>
                </div>
                <div class="se-fc-preview">${preview}</div>
                ${cards.length > 3 ? `<div class="se-more-badge">+${cards.length - 3} tarjetas más</div>` : ''}
                <div class="se-actions">
                    <button class="se-action-btn primary" onclick="goStudy('flashcards')">
                        <i class="fas fa-play"></i> Estudiar flashcards
                    </button>
                    <button class="se-fav-btn" id="favBtn-flashcards" onclick="toggleFavorite('flashcards')">
                        <i class="far fa-heart"></i> Guardar
                    </button>
                </div>
            </div>
        `;
    }

    // — Esquemas —
    function buildEsquemasPanel(data, config) {
        const tipoLabels = { jerarquico:'Jerárquico', conceptual:'Conceptual', timeline:'Línea del tiempo', 'causa-efecto':'Causa y efecto', ciclico:'Cíclico' };
        const tipo = config?.tipo || data?.schemaType || 'jerarquico';
        const root = data.rootNode;

        // ── Utilidades compartidas ──
        function wrapText(label, maxChars) {
            if (!label) return [''];
            const words = label.split(' ');
            const lines = []; let cur = '';
            words.forEach(w => {
                if ((cur + ' ' + w).trim().length > maxChars && cur) { lines.push(cur); cur = w; }
                else cur = (cur + ' ' + w).trim();
            });
            if (cur) lines.push(cur);
            return lines;
        }
        function escSvg(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
        function measureText(lines, fontSize) {
            const charW = fontSize * 0.58;
            const w = Math.max(...lines.map(l => l.length)) * charW + 24;
            const h = lines.length * (fontSize + 4) + 14;
            return { w, h };
        }
        function svgTextBlock(lines, cx, cy, fontSize, fill, weight) {
            const lh = fontSize + 4;
            const startY = cy - ((lines.length - 1) * lh) / 2;
            return lines.map((l, i) =>
                `<text x="${cx}" y="${startY + i * lh}" text-anchor="middle" dominant-baseline="central" fill="${fill}" font-size="${fontSize}" font-weight="${weight||'normal'}" font-family="'Segoe UI',system-ui,sans-serif">${escSvg(l)}</text>`
            ).join('');
        }

        // ══════════════════════════════════════════════════
        // JERÁRQUICO — Árbol top-down con gradientes purple
        // Fiel a la card: root (violeta oscuro) → mid (violeta medio) → leaf (violeta claro)
        // Líneas conectoras finas, nodos redondeados
        // ══════════════════════════════════════════════════
        function renderJerarquico(root) {
            if (!root) return '';

            const gradients = [
                { id:'jg0', c1:'#8b5cf6', c2:'#7c3aed' },
                { id:'jg1', c1:'#a78bfa', c2:'#8b5cf6' },
                { id:'jg2', c1:'#c4b5fd', c2:'#a78bfa' },
            ];
            const textColors = ['#fff', '#fff', 'rgba(20,10,40,0.9)'];
            const fontSizes = [13, 11.5, 10.5];
            const levelH = 85;
            const nodeGap = 14;

            let defs = gradients.map(g =>
                `<linearGradient id="${g.id}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${g.c1}"/><stop offset="100%" stop-color="${g.c2}"/></linearGradient>`
            ).join('');
            defs += `<filter id="jGlow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
            defs += `<filter id="jGlowSm"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;

            // Pass 1: compute each node's size and subtree width (bottom-up)
            const meta = new Map();
            function computeWidths(node, depth) {
                const d = Math.min(depth, 2);
                const fs = fontSizes[d];
                const maxChars = depth === 0 ? 20 : depth === 1 ? 16 : 14;
                const lines = wrapText(node.label, maxChars);
                const { w, h } = measureText(lines, fs);
                const children = node.children || [];
                let subtreeW;
                if (children.length === 0) {
                    subtreeW = w;
                } else {
                    children.forEach(c => computeWidths(c, depth + 1));
                    const childrenTotalW = children.reduce((sum, c) => sum + meta.get(c).subtreeW, 0)
                        + (children.length - 1) * nodeGap;
                    subtreeW = Math.max(w, childrenTotalW);
                }
                meta.set(node, { w, h, lines, depth, subtreeW });
            }
            computeWidths(root, 0);

            // Pass 2: assign x,y positions (top-down)
            const positions = new Map();
            function layoutNode(node, cx, cy) {
                const m = meta.get(node);
                positions.set(node, { cx, cy, w: m.w, h: m.h, lines: m.lines, depth: m.depth });
                const children = node.children || [];
                if (children.length === 0) return;
                const childrenTotalW = children.reduce((sum, c) => sum + meta.get(c).subtreeW, 0)
                    + (children.length - 1) * nodeGap;
                let startX = cx - childrenTotalW / 2;
                children.forEach(c => {
                    const cm = meta.get(c);
                    const childCx = startX + cm.subtreeW / 2;
                    layoutNode(c, childCx, cy + levelH);
                    startX += cm.subtreeW + nodeGap;
                });
            }

            const rootMeta = meta.get(root);
            const svgW = Math.max(600, rootMeta.subtreeW + 80);
            let maxDepth = 0;
            meta.forEach(m => { if (m.depth > maxDepth) maxDepth = m.depth; });
            const svgH = (maxDepth + 1) * levelH + 40;
            layoutNode(root, svgW / 2, 35);

            // Draw lines
            let linesStr = '';
            function drawLines(node) {
                const p = positions.get(node);
                (node.children || []).forEach(child => {
                    const cp = positions.get(child);
                    if (p && cp) {
                        linesStr += `<line x1="${p.cx}" y1="${p.cy + p.h/2}" x2="${cp.cx}" y2="${cp.cy - cp.h/2}" stroke="rgba(139,92,246,0.35)" stroke-width="2"/>`;
                    }
                    drawLines(child);
                });
            }
            drawLines(root);

            // Draw nodes
            let nodesStr = '';
            positions.forEach((p, node) => {
                const gIdx = Math.min(p.depth, 2);
                const grad = gradients[gIdx].id;
                const filter = p.depth === 0 ? ' filter="url(#jGlow)"' : p.depth === 1 ? ' filter="url(#jGlowSm)"' : '';
                nodesStr += `<rect x="${p.cx - p.w/2}" y="${p.cy - p.h/2}" width="${p.w}" height="${p.h}" rx="10" fill="url(#${grad})"${filter}/>`;
                nodesStr += svgTextBlock(p.lines, p.cx, p.cy, fontSizes[gIdx], textColors[gIdx], p.depth === 0 ? '600' : 'normal');
            });

            return `<div class="se-schema-svg-wrap"><svg viewBox="0 0 ${svgW} ${svgH}"><defs>${defs}</defs>${linesStr}${nodesStr}</svg></div>`;
        }

        // ══════════════════════════════════════════════════
        // CONCEPTUAL — Nodo central dorado + burbujas radiales
        // Fiel a la card: centro con lightbulb dorado con glow,
        // burbujas coloreadas en rounded-rect grandes, líneas doradas
        // Sin sub-nodos — limpio y radial
        // ══════════════════════════════════════════════════
        function renderConceptual(root) {
            if (!root) return '';
            const children = (root.children || []).slice(0, 8);
            const n = Math.max(children.length, 1);

            // Adaptar radio según cantidad de nodos
            const R = n <= 3 ? 140 : n <= 5 ? 160 : 175;
            const padding = 100; // espacio para burbujas en los bordes
            const W = (R + padding) * 2;
            const H = W;
            const cx = W / 2, cy = H / 2;

            const cols = ['#2dd4bf','#3b82f6','#22c55e','#ec4899','#8b5cf6','#f97316','#ef4444','#fbbf24'];

            let defs = `<radialGradient id="cgGold"><stop offset="0%" stop-color="#fcd34d"/><stop offset="100%" stop-color="#f59e0b"/></radialGradient>`;
            defs += `<filter id="cgGlow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;

            let lines = '', bubbles = '';
            children.forEach((c, i) => {
                const angle = (2 * Math.PI * i / n) - Math.PI / 2;
                const x = cx + R * Math.cos(angle);
                const y = cy + R * Math.sin(angle);
                const col = cols[i % cols.length];
                const txtLines = wrapText(c.label, 13);
                const { w: bW, h: bH } = measureText(txtLines, 12);

                // Línea dorada del centro a la burbuja
                lines += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(251,191,36,0.3)" stroke-width="2"/>`;
                // Burbuja coloreada grande (como la card)
                bubbles += `<rect x="${x-bW/2}" y="${y-bH/2}" width="${bW}" height="${bH}" rx="14" fill="${col}" opacity="0.92"/>`;
                bubbles += svgTextBlock(txtLines, x, y, 12, '#fff', '600');
            });

            // Centro dorado con lightbulb (igual a la card)
            const centerR = n <= 3 ? 36 : 40;
            const center = `<circle cx="${cx}" cy="${cy}" r="${centerR}" fill="url(#cgGold)" filter="url(#cgGlow)"/>` +
                `<text x="${cx}" y="${cy+5}" text-anchor="middle" dominant-baseline="middle" font-size="24">💡</text>`;

            return `<div class="se-schema-svg-wrap" style="max-width:550px;"><svg viewBox="0 0 ${W} ${H}"><defs>${defs}</defs>${lines}${center}${bubbles}</svg></div>`;
        }

        // ══════════════════════════════════════════════════
        // LÍNEA DEL TIEMPO — Línea horizontal con dots y cards alternados
        // Fiel a la card: línea cyan degradada, dots coloreados con glow,
        // cards con borde del color del dot, stems conectores, alternando arriba/abajo
        // ══════════════════════════════════════════════════
        function renderTimeline(root) {
            if (!root) return '';
            const nodes = [];
            function flatten(n) { nodes.push(n.label); (n.children||[]).forEach(flatten); }
            flatten(root);
            const dotCols = ['#22c55e','#3b82f6','#fbbf24','#ec4899','#8b5cf6','#f97316','#2dd4bf','#ef4444'];
            const n = nodes.length;
            const svgW = Math.max(650, n * 130);
            const spineY = 150;
            const cardH = 50;

            let defs = `<filter id="tDotGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;

            const items = nodes.map((label, i) => {
                const x = 65 + i * (svgW - 130) / Math.max(n - 1, 1);
                const above = i % 2 === 0;
                const col = dotCols[i % dotCols.length];
                const txtLines = wrapText(label, 14);
                const { w: bW, h: bH } = measureText(txtLines, 10.5);
                const stemLen = 18;
                const cardY = above ? spineY - 10 - stemLen - bH : spineY + 10 + stemLen;
                const stemY1 = above ? spineY - 10 : spineY + 10;
                const stemY2 = above ? cardY + bH : cardY;

                let s = '';
                // Stem
                s += `<line x1="${x}" y1="${stemY1}" x2="${x}" y2="${stemY2}" stroke="${col}" stroke-width="2" stroke-opacity="0.5"/>`;
                // Card con borde coloreado (como la ilustración)
                s += `<rect x="${x-bW/2}" y="${cardY}" width="${bW}" height="${bH}" rx="8" fill="rgba(15,15,40,0.85)" stroke="${col}" stroke-width="1.5"/>`;
                // Texto
                s += svgTextBlock(txtLines, x, cardY + bH/2, 10.5, 'rgba(255,255,255,0.9)', 'normal');
                // Dot con glow
                s += `<circle cx="${x}" cy="${spineY}" r="9" fill="${col}" filter="url(#tDotGlow)"/>`;
                s += `<circle cx="${x}" cy="${spineY}" r="4" fill="rgba(255,255,255,0.5)"/>`;
                return s;
            }).join('');

            const svgH = spineY * 2 + 40;
            // Línea principal con gradiente cyan como la card
            const spine = `<line x1="25" y1="${spineY}" x2="${svgW-25}" y2="${spineY}" stroke="rgba(45,212,191,0.45)" stroke-width="3" stroke-linecap="round"/>`;

            return `<div class="se-schema-svg-wrap"><svg viewBox="0 0 ${svgW} ${svgH}"><defs>${defs}</defs>${spine}${items}</svg></div>`;
        }

        // ══════════════════════════════════════════════════
        // CAUSA Y EFECTO — Diagrama Ishikawa / Espina de pescado
        // Fiel a la card: cola izquierda (flecha), espina dorada,
        // cabeza derecha (triángulo grande), ramas diagonales con sub-causas
        // ══════════════════════════════════════════════════
        function renderCausaEfecto(root) {
            if (!root) return '';
            const causes = (root.children || []);
            const top = [], bot = [];
            causes.forEach((c, i) => { (i % 2 === 0 ? top : bot).push(c); });

            const maxSide = Math.max(top.length, bot.length, 1);
            const svgW = Math.max(650, maxSide * 180 + 200);
            const svgH = 340;
            const spineY = svgH / 2;
            const branchCols = ['rgba(239,68,68,0.85)','rgba(99,102,241,0.85)','rgba(34,197,94,0.85)','rgba(251,191,36,0.85)','rgba(139,92,246,0.85)','rgba(45,212,191,0.85)'];
            const branchBg =  ['rgba(239,68,68,0.15)','rgba(99,102,241,0.15)','rgba(34,197,94,0.15)','rgba(251,191,36,0.15)','rgba(139,92,246,0.15)','rgba(45,212,191,0.15)'];

            const tailX = 35;
            const headX = svgW - 70;
            const spineLen = headX - tailX - 20;

            let defs = `<filter id="hGlow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
            let svg = '';

            // Tail (flecha izquierda)
            svg += `<polygon points="${tailX-12},${spineY-14} ${tailX+6},${spineY} ${tailX-12},${spineY+14}" fill="rgba(251,191,36,0.45)"/>`;
            // Spine
            svg += `<line x1="${tailX}" y1="${spineY}" x2="${headX}" y2="${spineY}" stroke="rgba(251,191,36,0.7)" stroke-width="3.5" stroke-linecap="round"/>`;
            // Head (triángulo derecho)
            svg += `<polygon points="${headX},${spineY-28} ${headX+55},${spineY} ${headX},${spineY+28}" fill="rgba(251,191,36,0.85)" filter="url(#hGlow)"/>`;

            // Efecto label (arriba del head para que no se corte)
            const eLines = wrapText(root.label, 16);
            const { w: eW, h: eH } = measureText(eLines, 11);
            svg += `<rect x="${headX-eW/2+20}" y="${spineY-28-eH-8}" width="${eW}" height="${eH}" rx="6" fill="rgba(251,191,36,0.15)" stroke="rgba(251,191,36,0.4)" stroke-width="1"/>`;
            svg += svgTextBlock(eLines, headX + 20, spineY - 28 - eH/2 - 8, 11, 'rgba(251,191,36,0.95)', '700');

            function drawBranch(cause, i, isTop, totalInSide) {
                const col = branchCols[i % branchCols.length];
                const bg = branchBg[i % branchBg.length];
                // Distribute branches evenly along the usable spine
                const spacing = spineLen / (totalInSide + 1);
                const bx = tailX + 30 + spacing * (i + 1);
                const dy = isTop ? -100 : 100;
                const endX = bx - 40;
                const endY = spineY + dy;

                // Diagonal branch line
                svg += `<line x1="${bx}" y1="${spineY}" x2="${endX}" y2="${endY}" stroke="${col}" stroke-width="2.5" stroke-linecap="round"/>`;

                // Main cause label box
                const lines = wrapText(cause.label, 14);
                const { w: bW, h: bH } = measureText(lines, 10.5);
                const labelY = isTop ? endY - bH/2 - 4 : endY + bH/2 + 4;
                svg += `<rect x="${endX-bW/2}" y="${labelY-bH/2}" width="${bW}" height="${bH}" rx="7" fill="${bg}" stroke="${col}" stroke-width="1.2"/>`;
                svg += svgTextBlock(lines, endX, labelY, 10.5, '#fff', '500');

                // Sub-causas (líneas pequeñas sobre la rama diagonal)
                if (cause.children) {
                    cause.children.slice(0, 2).forEach((sub, si) => {
                        const t = 0.3 + si * 0.28;
                        const sx = bx + (endX - bx) * t;
                        const sy = spineY + dy * t;
                        const lineLen = 28;
                        const offX = -lineLen;
                        const offY = isTop ? -8 : 8;
                        svg += `<line x1="${sx}" y1="${sy}" x2="${sx+offX}" y2="${sy+offY}" stroke="${col}" stroke-width="1.5" stroke-opacity="0.5"/>`;
                        svg += `<text x="${sx+offX-3}" y="${sy+offY + (isTop ? -5 : 12)}" text-anchor="end" fill="rgba(255,255,255,0.55)" font-size="8.5" font-family="'Segoe UI',sans-serif">${escSvg(sub.label)}</text>`;
                    });
                }
            }

            top.forEach((c, i) => drawBranch(c, i, true, top.length));
            bot.forEach((c, i) => drawBranch(c, i, false, bot.length));

            return `<div class="se-schema-svg-wrap"><svg viewBox="0 0 ${svgW} ${svgH}"><defs>${defs}</defs>${svg}</svg></div>`;
        }

        // ══════════════════════════════════════════════════
        // CÍCLICO — Anillo grueso segmentado con flechas
        // Fiel a la card (Image 7): anillo grueso con arcos coloreados,
        // flechas triangulares en las uniones, labels como texto
        // coloreado FUERA del anillo, icono refresh en el centro
        // ══════════════════════════════════════════════════
        function renderCiclico(root) {
            if (!root) return '';
            const fases = (root.children || []);
            if (!fases.length) return `<div style="text-align:center;color:#a78bfa;padding:20px">${escSvg(root.label)}</div>`;
            const n = fases.length;
            const ringR = 130;
            const labelR = ringR + 55; // distancia del centro a los labels
            const W = (labelR + 80) * 2;
            const H = W;
            const cx = W / 2, cy = H / 2;
            const strokeW = 7; // grosor del anillo
            const colors = ['#3b82f6','#22c55e','#f97316','#ec4899','#8b5cf6','#fbbf24','#2dd4bf','#ef4444'];

            let svg = '', defs = '';

            // Dibujar arcos del anillo (segmentos gruesos)
            fases.forEach((f, i) => {
                const col = colors[i % colors.length];
                const startAngle = (2 * Math.PI * i / n) - Math.PI / 2;
                const endAngle = (2 * Math.PI * (i + 1) / n) - Math.PI / 2;
                // Gap más amplio para que las flechas no toquen los arcos
                const gapAngle = 0.22;
                const sa = startAngle + gapAngle;
                const ea = endAngle - gapAngle;
                const x1 = cx + ringR * Math.cos(sa);
                const y1 = cy + ringR * Math.sin(sa);
                const x2 = cx + ringR * Math.cos(ea);
                const y2 = cy + ringR * Math.sin(ea);
                const arcSpan = ea - sa;
                const largeArc = arcSpan > Math.PI ? 1 : 0;
                svg += `<path d="M${x1} ${y1} A${ringR} ${ringR} 0 ${largeArc} 1 ${x2} ${y2}" fill="none" stroke="${col}" stroke-width="${strokeW}" stroke-linecap="round" stroke-opacity="0.75"/>`;
            });

            // Dibujar flechas triangulares en las uniones del anillo
            fases.forEach((f, i) => {
                const col = colors[i % colors.length];
                const junctionAngle = (2 * Math.PI * (i + 1) / n) - Math.PI / 2;
                // Punto en el anillo donde termina el segmento
                const px = cx + ringR * Math.cos(junctionAngle);
                const py = cy + ringR * Math.sin(junctionAngle);
                // Dirección tangente (perpendicular al radio, en sentido horario)
                const tx = -Math.sin(junctionAngle);
                const ty = Math.cos(junctionAngle);
                // Normal (hacia afuera del centro)
                const nx = Math.cos(junctionAngle);
                const ny = Math.sin(junctionAngle);
                // Triángulo: punta en dirección tangente, base perpendicular
                const arrowLen = 14;
                const arrowW = 10;
                const tipX = px + tx * arrowLen;
                const tipY = py + ty * arrowLen;
                const baseAx = px + nx * arrowW/2;
                const baseAy = py + ny * arrowW/2;
                const baseBx = px - nx * arrowW/2;
                const baseBy = py - ny * arrowW/2;
                svg += `<polygon points="${tipX},${tipY} ${baseAx},${baseAy} ${baseBx},${baseBy}" fill="${col}" opacity="0.9"/>`;
            });

            // Labels de fases FUERA del anillo (texto coloreado, sin cajas)
            fases.forEach((f, i) => {
                const col = colors[i % colors.length];
                const midAngle = (2 * Math.PI * (i + 0.5) / n) - Math.PI / 2;
                const lx = cx + labelR * Math.cos(midAngle);
                const ly = cy + labelR * Math.sin(midAngle);
                const txtLines = wrapText(f.label, 14);
                svg += svgTextBlock(txtLines, lx, ly, 13, col, '600');
            });

            // Centro: círculo dashed + icono refresh
            svg += `<circle cx="${cx}" cy="${cy}" r="30" fill="rgba(139,92,246,0.15)" stroke="rgba(139,92,246,0.5)" stroke-width="2.5" stroke-dasharray="6,3"/>`;
            svg += `<text x="${cx}" y="${cy+7}" text-anchor="middle" dominant-baseline="middle" fill="#a78bfa" font-size="24">↻</text>`;

            return `<div class="se-schema-svg-wrap" style="max-width:550px;"><svg viewBox="0 0 ${W} ${H}"><defs>${defs}</defs>${svg}</svg></div>`;
        }

        let schemaHTML;
        switch(tipo) {
            case 'conceptual':   schemaHTML = renderConceptual(root);   break;
            case 'timeline':     schemaHTML = renderTimeline(root);     break;
            case 'causa-efecto': schemaHTML = renderCausaEfecto(root);  break;
            case 'ciclico':      schemaHTML = renderCiclico(root);      break;
            default:             schemaHTML = renderJerarquico(root);   break;
        }

        return `
            <div class="se-panel-inner">
                <div class="se-panel-stats">
                    <div class="se-stat"><span class="se-stat-val">${tipoLabels[tipo] || tipo}</span><span class="se-stat-lbl">tipo</span></div>
                    <div class="se-stat"><span class="se-stat-val">${countNodes(root)}</span><span class="se-stat-lbl">nodos</span></div>
                </div>
                <div class="se-tree-container">
                    ${root ? schemaHTML : '<p style="color:rgba(255,255,255,0.4)">Sin datos</p>'}
                </div>
                <div class="se-actions">
                    <button class="se-action-btn primary" onclick="openFullscreen()">
                        <i class="fas fa-expand"></i> Ver pantalla completa
                    </button>
                    <button class="se-fav-btn" id="favBtn-esquemas" onclick="toggleFavorite('esquemas')">
                        <i class="far fa-heart"></i> Guardar
                    </button>
                </div>
            </div>
        `;
    }
    function countNodes(node) {
        if (!node) return 0;
        return 1 + (node.children || []).reduce((s, c) => s + countNodes(c), 0);
    }

                    <div class="se-stat"><span class="se-stat-val">${diff[config?.dificultad] || '—'}</span><span class="se-stat-lbl">dificultad</span></div>

    // — Resumen —
    function buildResumenPanel(data) {
        const sections = data.sections || [];
        const keywords = data.keywords || [];

        const previewSections = sections.slice(0, 2).map(sec => `
            <div class="se-resumen-section-preview">
                <div class="se-resumen-section-num">${sec.number || ''}</div>
                <div class="se-resumen-section-body">
                    <div class="se-resumen-section-heading">${sec.heading || ''}</div>
                    <div class="se-resumen-section-text">${sec.body ? sec.body.substring(0, 120) + (sec.body.length > 120 ? '…' : '') : ''}</div>
                </div>
            </div>
        `).join('');

        const kwTags = keywords.slice(0, 5).map(kw =>
            `<span class="se-keyword-tag">${kw}</span>`
        ).join('');

        const readMins = data.readingMinutes || Math.max(1, Math.round(sections.length * 1.5));

        return `
            <div class="se-panel-inner">
                <div class="se-panel-stats">
                    <div class="se-stat"><span class="se-stat-val">${sections.length}</span><span class="se-stat-lbl">secciones</span></div>
                    <div class="se-stat"><span class="se-stat-val">${keywords.length}</span><span class="se-stat-lbl">palabras clave</span></div>
                    <div class="se-stat"><span class="se-stat-val">${readMins} min</span><span class="se-stat-lbl">lectura</span></div>
                </div>
                ${previewSections}
                ${sections.length > 2 ? `<div class="se-more-badge">+${sections.length - 2} secciones más</div>` : ''}
                ${kwTags ? `<div class="se-keywords-row" style="display:flex;flex-wrap:wrap;gap:6px;margin:0.75rem 0;">${kwTags}</div>` : ''}
                <div class="se-actions">
                    <button class="se-action-btn primary" onclick="goStudy('resumenes')">
                        <i class="fas fa-book-open"></i> Leer completo
                    </button>
                    <button class="se-fav-btn" id="favBtn-resumenes" onclick="toggleFavorite('resumenes')">
                        <i class="far fa-heart"></i> Guardar
                    </button>
                </div>
            </div>
        `;
    }

    // ================================================================
    // ACCIONES
    // ================================================================
    function goStudy(opt) {
        if (opt === 'examenes') {
            const tipo = flow?.configs?.examenes?.tipo;
            window.location.href = tipo === 'expert_exam'
                ? '../pages/examen-experto.html'
                : '../pages/examen-quiz.html';
            return;
        }
        if (opt === 'resumenes') {
            const id = results?.resumenes?.id;
            window.location.href = '../pages/resumenes.html' + (id ? '?id=' + id : '');
            return;
        }
        const routes = {
            flashcards: '../pages/flashcards.html',
            esquemas:   '../pages/seleccion-esquema.html'
        };
        if (routes[opt]) window.location.href = routes[opt];
    }

    // ================================================================
    // FULLSCREEN ESQUEMA
    // ================================================================
    let fsScale = 1;
    function openFullscreen() {
        const treeContainer = document.querySelector('.se-tree-container');
        if (!treeContainer) return;
        const overlay = document.getElementById('fsOverlay');
        const body = document.getElementById('fsBody');
        // Copiar el contenido del esquema al overlay
        body.innerHTML = treeContainer.innerHTML;
        // Quitar max-width para que se expanda
        const wrap = body.querySelector('.se-schema-svg-wrap');
        if (wrap) { wrap.style.maxWidth = '95vw'; wrap.style.width = '95vw'; }
        // Título
        const tipo = flow?.configs?.esquemas?.tipo || 'esquema';
        const tipoLabels = { jerarquico:'Jerárquico', conceptual:'Conceptual', timeline:'Línea del tiempo', 'causa-efecto':'Causa y efecto', ciclico:'Cíclico' };
        document.getElementById('fsTitle').textContent = tipoLabels[tipo] || 'Esquema';
        fsScale = 1;
        document.getElementById('fsZoomLevel').textContent = '100%';
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
    }
    function closeFullscreen() {
        document.getElementById('fsOverlay').classList.remove('active');
        document.body.style.overflow = '';
    }
    function fsZoom(delta) {
        fsScale = Math.max(0.3, Math.min(3, fsScale + delta));
        const wrap = document.querySelector('#fsBody .se-schema-svg-wrap');
        if (wrap) wrap.style.transform = `scale(${fsScale})`;
        document.getElementById('fsZoomLevel').textContent = Math.round(fsScale * 100) + '%';
    }
    function fsZoomReset() {
        fsScale = 1;
        const wrap = document.querySelector('#fsBody .se-schema-svg-wrap');
        if (wrap) wrap.style.transform = 'scale(1)';
        document.getElementById('fsZoomLevel').textContent = '100%';
    }
    // Cerrar con Escape
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && document.getElementById('fsOverlay').classList.contains('active')) {
            closeFullscreen();
        }
    });

    // Estado de favoritos por opción
    const favoriteState = {};

    async function toggleFavorite(opt) {
        const contentId = results?.[opt]?.id;
        if (!contentId) { showToast('Contenido no disponible'); return; }

        const btn = document.getElementById('favBtn-' + opt);
        const isCurrentlyFav = favoriteState[opt] || false;
        const newState = !isCurrentlyFav;

        try {
            const response = await fetch('../api/favoritos', {
                method:  'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-User-Id': flow.userId
                },
                body: JSON.stringify({
                    contentId:  contentId,
                    isFavorite: newState
                })
            });

            const data = await response.json();
            if (data.success) {
                favoriteState[opt] = newState;
                if (btn) {
                    if (newState) {
                        btn.classList.add('active', 'animating');
                        btn.innerHTML = '<i class="fas fa-heart"></i> Guardado';
                        createHeartSparkles(btn);
                        setTimeout(() => btn.classList.remove('animating'), 500);
                    } else {
                        btn.classList.remove('active');
                        btn.innerHTML = '<i class="far fa-heart"></i> Guardar';
                    }
                }
                showToast(newState ? 'Guardado en favoritos' : 'Eliminado de favoritos');
            } else {
                showToast('Error al actualizar favorito');
                console.error('[Favorito]', data.error);
            }
        } catch (error) {
            console.error('[Favorito] Error de conexión:', error);
            showToast('Error de conexión');
        }
    }

    function createHeartSparkles(btn) {
        const container = document.createElement('div');
        container.className = 'sparkle-container';
        btn.appendChild(container);
        const angles = [0, 45, 90, 135, 180, 225, 270, 315];
        angles.forEach(angle => {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            const distance = 25 + Math.random() * 15;
            const rad = (angle * Math.PI) / 180;
            const x = Math.cos(rad) * distance;
            const y = Math.sin(rad) * distance;
            sparkle.style.setProperty('--sparkle-end', `translate(${x}px, ${y}px)`);
            container.appendChild(sparkle);
        });
        setTimeout(() => container.remove(), 700);
    }

    // ================================================================
    // TOAST
    // ================================================================
    function showToast(msg) {
        const t = document.getElementById('toast');
        document.getElementById('toastMessage').textContent = msg;
        t.classList.add('show');
        clearTimeout(t._t);
        t._t = setTimeout(() => t.classList.remove('show'), 3000);
    }

    // ================================================================
    // STARS — loading screen
    // ================================================================
    function initLoadingStars() {
        const canvas = document.getElementById('loadingStars');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const stars = Array.from({length:200}, () => ({
            x:Math.random()*canvas.width, y:Math.random()*canvas.height,
            size:Math.random()*2+0.2, speedX:(Math.random()-0.5)*0.08, speedY:(Math.random()-0.5)*0.08,
            opacity:Math.random()*0.5+0.1, opacityChange:(Math.random()-0.5)*0.01,
            color:['#ffffff','#ffe9c4','#d4f1ff','#c4b5fd'][Math.floor(Math.random()*4)]
        }));
        function animate() {
            if (!document.getElementById('loadingStars')) return;
            ctx.clearRect(0,0,canvas.width,canvas.height);
            stars.forEach(s => {
                s.x+=s.speedX; s.y+=s.speedY;
                if(s.x<0)s.x=canvas.width; if(s.x>canvas.width)s.x=0;
                if(s.y<0)s.y=canvas.height; if(s.y>canvas.height)s.y=0;
                s.opacity+=s.opacityChange; if(s.opacity<=0.05||s.opacity>=0.7)s.opacityChange*=-1;
                ctx.beginPath(); ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
                ctx.fillStyle=s.color; ctx.globalAlpha=s.opacity; ctx.fill();
            });
            ctx.globalAlpha=1; requestAnimationFrame(animate);
        }
        animate();
    }

    function initResultStars() {
        const canvas = document.getElementById('starsCanvas');
        const ctx = canvas.getContext('2d'), content = document.getElementById('mainContent');
        function resize() { canvas.width = content.offsetWidth; canvas.height = Math.max(content.scrollHeight, window.innerHeight); }
        resize();
        const stars = Array.from({length:120}, () => ({
            x:Math.random()*canvas.width, y:Math.random()*canvas.height,
            size:Math.random()*1.8+0.2, speedX:(Math.random()-0.5)*0.08, speedY:(Math.random()-0.5)*0.08,
            opacity:Math.random()*0.35+0.05, opacityChange:(Math.random()-0.5)*0.01,
            color:['#ffffff','#c4b5fd','#aaddff'][Math.floor(Math.random()*3)]
        }));
        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            stars.forEach(s => {
                s.x+=s.speedX; s.y+=s.speedY;
                if(s.x<0)s.x=canvas.width; if(s.x>canvas.width)s.x=0;
                if(s.y<0)s.y=canvas.height; if(s.y>canvas.height)s.y=0;
                s.opacity+=s.opacityChange; if(s.opacity<=0.02||s.opacity>=0.5)s.opacityChange*=-1;
                ctx.beginPath(); ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
                ctx.fillStyle=s.color; ctx.globalAlpha=s.opacity; ctx.fill();
            });
            ctx.globalAlpha=1; requestAnimationFrame(animate);
        }
        animate(); window.addEventListener('resize',resize);
    }
    </script>
