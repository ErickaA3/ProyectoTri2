<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi ProfesorIA - Sesión de Estudio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles-shared.css">
    <link rel="stylesheet" href="../css/sesion-estudio.css">
    <style>
        /* Schema container */
        .se-schema-svg-wrap { width:100%; margin:0 auto; padding:16px 0; }
        .se-schema-svg-wrap svg { display:block; width:100%; height:auto; }
        .se-schema-svg-wrap svg text { font-family:'Segoe UI',system-ui,sans-serif; }

        /* Tree container — centrado y más grande */
        .se-tree-container {
            width:100% !important; max-width:100% !important;
            display:flex; flex-direction:column; align-items:center;
            padding:24px 16px; min-height:300px; overflow:visible !important;
        }
        .se-panel-inner { width:100% !important; max-width:100% !important; overflow:visible !important; }
        .se-result-panel, .se-panel, .se-content { overflow:visible !important; }

        /* ═══ Floating detail tooltip (jerárquico + causa-efecto) ═══ */
        .svg-detail-wrap { position:relative; width:100%; }
        .float-detail { position:absolute; z-index:50; max-width:340px; min-width:220px; pointer-events:none; }
        /* CLOSE sequence: card shrinks first → then stem retracts */
        .float-detail .fd-stem { width:3px; height:0; background:rgba(139,92,246,0.5); margin:0 auto; border-radius:2px; transition:height 0.2s cubic-bezier(0.4,0,0.2,1) 0.15s; }
        .float-detail .fd-card { background:rgba(10,10,28,0.97); backdrop-filter:blur(18px); border-radius:14px; padding:0; box-shadow:0 16px 48px rgba(0,0,0,0.7); border-left:3px solid rgba(139,92,246,0.5); border-top:1px solid rgba(139,92,246,0.15); border-right:1px solid rgba(139,92,246,0.08); border-bottom:1px solid rgba(139,92,246,0.08); max-height:0; overflow:hidden; opacity:0; transition:max-height 0.18s cubic-bezier(0.4,0,0.2,1), opacity 0.12s ease, padding 0.15s ease; }
        /* OPEN sequence: stem grows first → then card expands */
        .float-detail.on .fd-stem { height:30px; transition:height 0.22s cubic-bezier(0.4,0,0.2,1); }
        .float-detail.on .fd-card { max-height:280px; opacity:1; padding:18px 22px; pointer-events:auto; transition:max-height 0.28s cubic-bezier(0.4,0,0.2,1) 0.18s, opacity 0.2s ease 0.18s, padding 0.22s ease 0.18s; }
        .float-detail .fd-title { font-size:0.92rem; font-weight:700; color:#c4b5fd; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
        .float-detail .fd-title::before { content:''; width:8px; height:8px; border-radius:50%; background:#8b5cf6; flex-shrink:0; box-shadow:0 0 8px rgba(139,92,246,0.5); }
        .float-detail .fd-body { font-size:0.84rem; color:rgba(255,255,255,0.75); line-height:1.65; }
        /* CE variant: horizontal line to the left + card */
        .float-detail.ce-style { display:flex; flex-direction:row-reverse; align-items:center; max-width:none; min-width:0; }
        .float-detail.ce-style .fd-stem { width:0; height:3px; margin:0; border-radius:2px; transition:width 0.2s cubic-bezier(0.4,0,0.2,1) 0.12s; background:var(--ce-col, rgba(251,191,36,0.4)); flex-shrink:0; }
        .float-detail.ce-style.on .fd-stem { width:24px; transition:width 0.22s cubic-bezier(0.4,0,0.2,1); }
        .float-detail.ce-style .fd-card { max-width:220px; min-width:150px; border-left:3px solid var(--ce-col, rgba(251,191,36,0.5)); border-top:1px solid rgba(255,255,255,0.06); border-right:1px solid rgba(255,255,255,0.04); border-bottom:1px solid rgba(255,255,255,0.04); max-height:0; overflow:hidden; opacity:0; padding:0; transition:max-height 0.18s cubic-bezier(0.4,0,0.2,1), opacity 0.12s ease, padding 0.15s ease; }
        .float-detail.ce-style.on .fd-card { max-height:180px; opacity:1; padding:10px 14px; transition:max-height 0.25s cubic-bezier(0.4,0,0.2,1) 0.16s, opacity 0.18s ease 0.16s, padding 0.2s ease 0.16s; }
        .float-detail.ce-style .fd-title { font-size:0.78rem; color:var(--ce-col, #fbbf24); margin-bottom:5px; }
        .float-detail.ce-style .fd-title::before { background:var(--ce-col, #fbbf24); box-shadow:0 0 8px var(--ce-col, rgba(251,191,36,0.5)); width:6px; height:6px; }
        .float-detail.ce-style .fd-body { font-size:0.72rem; line-height:1.5; }

        /* ═══ Conceptual ═══ */
        .cm-wrap { position:relative; width:100%; max-width:620px; margin:0 auto; aspect-ratio:1; }
        .cm-center { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:80px; height:80px; border-radius:50%; background:radial-gradient(circle,#fcd34d,#f59e0b); box-shadow:0 0 30px rgba(251,191,36,0.6),0 0 60px rgba(251,191,36,0.2); display:flex; align-items:center; justify-content:center; font-size:28px; z-index:10; animation:cmPulse 3s ease-in-out infinite; }
        @keyframes cmPulse { 0%,100%{box-shadow:0 0 30px rgba(251,191,36,0.6)} 50%{box-shadow:0 0 45px rgba(251,191,36,0.8)} }
        .cm-line { position:absolute; top:50%; left:50%; transform-origin:0 0; height:2px; background:rgba(251,191,36,0.18); transition:all 0.5s; z-index:1; }
        .cm-line.glow { background:rgba(251,191,36,0.65); box-shadow:0 0 10px rgba(251,191,36,0.5); height:3px; }
        .cm-node { position:absolute; transform:translate(-50%,-50%); padding:11px 18px; border-radius:16px; cursor:pointer; font-size:0.85rem; font-weight:600; color:#fff; text-align:center; transition:all 0.4s cubic-bezier(0.4,0,0.2,1); z-index:5; max-width:150px; border:2px solid rgba(255,255,255,0.1); }
        .cm-node:hover { transform:translate(-50%,-50%) scale(1.08); z-index:15; }
        .cm-node.open { transform:translate(-50%,-50%) scale(1.12); z-index:20; border-color:rgba(255,255,255,0.4); }
        .cm-expand { position:absolute; left:50%; transform:translateX(-50%); background:rgba(10,10,28,0.96); border-radius:14px; padding:0; max-height:0; overflow:hidden; opacity:0; transition:all 0.4s cubic-bezier(0.4,0,0.2,1); min-width:200px; backdrop-filter:blur(16px); pointer-events:none; box-shadow:0 14px 44px rgba(0,0,0,0.6); }
        .cm-expand.dir-down { top:calc(100% + 10px); } .cm-expand.dir-up { bottom:calc(100% + 10px); }
        .cm-node.open .cm-expand { max-height:500px; opacity:1; padding:12px 16px; pointer-events:auto; }

        /* ═══ Timeline ═══ */
        .tl-wrap { display:flex; align-items:stretch; position:relative; overflow:visible; padding:40px 20px; gap:0; width:100%; min-height:340px; }
        .tl-spine { position:absolute; top:50%; left:20px; right:20px; height:3px; background:linear-gradient(90deg,rgba(45,212,191,0.15),rgba(45,212,191,0.5),rgba(45,212,191,0.15)); z-index:0; }
        .tl-col { min-width:135px; flex:1; position:relative; z-index:1; }
        .tl-dot-w{width:18px;height:18px;border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);cursor:pointer;z-index:3}
        .tl-dot-w::after{content:'';position:absolute;inset:5px;border-radius:50%;background:rgba(255,255,255,0.45)}
        .tl-stem{width:2px;height:20px;opacity:0.4;position:absolute;left:50%;transform:translateX(-50%)}
        .tl-above .tl-stem{bottom:50%;margin-bottom:9px}
        .tl-below .tl-stem{top:50%;margin-top:9px}
        .tl-card-area{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:2;overflow:visible}
        .tl-above .tl-card-area{bottom:50%;margin-bottom:29px}
        .tl-below .tl-card-area{top:50%;margin-top:29px}
        .tl-top-space,.tl-bottom-space{display:none}
        .tl-card{padding:10px 16px;border-radius:10px;background:rgba(15,15,40,0.85);border:1.5px solid;font-size:0.82rem;color:rgba(255,255,255,0.92);text-align:center;max-width:140px;cursor:pointer;transition:all 0.3s;font-weight:500}
        .tl-card:hover{transform:scale(1.04)} .tl-card.active{background:rgba(15,15,40,0.95)}
        .tl-detail{max-height:0;overflow:hidden;opacity:0;transition:all 0.4s cubic-bezier(0.4,0,0.2,1);width:220px;z-index:50;position:relative}
        .tl-detail.on{max-height:600px;opacity:1;padding:10px 0;overflow:visible}
        .tl-detail-inner{background:rgba(10,10,28,0.96);backdrop-filter:blur(16px);border-radius:14px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,0.6);position:relative;z-index:50}
        .tl-detail-hd{font-size:0.82rem;font-weight:700;color:#fff;margin-bottom:8px;display:flex;align-items:center;gap:7px}
        .tl-detail-hd span{width:8px;height:8px;border-radius:50%;flex-shrink:0}

        /* ═══ Cíclico ═══ */
        .cy-outer{width:100%;max-width:750px;margin:0 auto;padding:50px;overflow:visible}
        .cy-ring-area{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:1}
        .cy-svg{position:absolute;inset:0;width:100%;height:100%}
        .cy-svg .cy-arc{transition:stroke-width 0.3s,stroke-opacity 0.3s;cursor:pointer}
        .cy-svg .cy-arc:hover{stroke-width:10;stroke-opacity:0.9}
        .cy-svg .cy-arc.on{stroke-width:12;stroke-opacity:1}
        .cy-center-ico{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:rgba(139,92,246,0.15);border:2.5px dashed rgba(139,92,246,0.45);display:flex;align-items:center;justify-content:center;font-size:20px;color:#a78bfa;z-index:5}
        .cy-phase{position:absolute;transform:translate(-50%,-50%);z-index:10}
        .cy-lbl{font-size:0.78rem;font-weight:600;cursor:pointer;padding:5px 12px;border-radius:10px;transition:all 0.35s;text-align:center;background:rgba(15,15,35,0.6);border:1.5px solid transparent;white-space:nowrap}
        .cy-lbl:hover{transform:scale(1.06)} .cy-lbl.on{transform:scale(1.08);background:rgba(15,15,35,0.92)}
        .cy-info{position:absolute;background:rgba(10,10,28,0.96);backdrop-filter:blur(16px);border-radius:16px;padding:0;width:240px;max-height:0;overflow:hidden;opacity:0;transition:all 0.45s cubic-bezier(0.4,0,0.2,1);z-index:30;box-shadow:0 14px 44px rgba(0,0,0,0.65);pointer-events:none}
        .cy-info.on{max-height:500px;opacity:1;padding:16px 18px;pointer-events:auto}
        .cy-info-hd{font-size:0.85rem;font-weight:700;color:#fff;margin-bottom:10px;display:flex;align-items:center;gap:8px}
        .cy-info-hd span{width:9px;height:9px;border-radius:50%;flex-shrink:0}
        .cy-info-ft{font-size:0.6rem;color:rgba(255,255,255,0.3);margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.06);text-transform:uppercase;letter-spacing:0.08em}

        /* ═══ Shared sub-items ═══ */
        .s-item{font-size:0.76rem;font-weight:600;color:rgba(255,255,255,0.85);padding:7px 11px;margin-bottom:4px;border-radius:8px;background:rgba(255,255,255,0.04);border-left:3px solid;line-height:1.45;cursor:pointer;transition:background 0.2s;display:flex;align-items:center;gap:6px}
        .s-item:hover{background:rgba(255,255,255,0.07)}
        .s-item-detail{max-height:0;overflow:hidden;opacity:0;transition:all 0.35s;font-size:0.73rem;font-weight:400;color:rgba(255,255,255,0.6);line-height:1.55;padding:0 11px}
        .s-item-detail.on{max-height:200px;opacity:1;padding:5px 11px 8px}
        .sub-arrow{margin-left:auto;opacity:0.4;font-size:0.6rem}
        .cm-sub-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
        @media(max-width:600px){.cy-outer{padding:20px}.cy-ring-area{max-width:280px}.cy-info{width:190px}}

        /* Fullscreen overlay */
        .fs-overlay {
            position:fixed; top:0; left:0; right:0; bottom:0;
            background:var(--primary-bg, #0f0f23);
            z-index:2000; display:none; flex-direction:column;
        }
        .fs-overlay.active { display:flex; }
        .fs-header {
            display:flex; align-items:center; justify-content:space-between;
            padding:12px 20px; background:rgba(26,26,53,0.95);
            border-bottom:1px solid rgba(139,92,246,0.2); flex-shrink:0;
        }
        .fs-close-btn {
            background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.4);
            color:#f87171; padding:8px 16px; border-radius:10px; cursor:pointer;
            font-family:inherit; font-size:0.9rem; transition:all 0.3s;
        }
        .fs-close-btn:hover { background:rgba(239,68,68,0.3); }
        .fs-title { color:#fff; font-size:1.1rem; }
        .fs-zoom { display:flex; align-items:center; gap:8px; }
        .fs-zoom button {
            background:rgba(139,92,246,0.15); border:1px solid rgba(139,92,246,0.3);
            color:#a78bfa; width:34px; height:34px; border-radius:8px; cursor:pointer;
            font-size:0.85rem; transition:all 0.3s;
        }
        .fs-zoom button:hover { background:rgba(139,92,246,0.3); }
        .fs-zoom span { color:rgba(255,255,255,0.5); font-size:0.8rem; min-width:40px; text-align:center; }
        .fs-body {
            flex:1; overflow:auto; display:flex; align-items:center; justify-content:center;
            padding:20px;
        }
        .fs-body .se-schema-svg-wrap { max-width:none; transition:transform 0.2s ease; }
    </style>
</head>
<body data-page="modo-estudio">

    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <!-- ================================================================
         PANTALLA DE CARGA (visible mientras genera)
    ================================================================ -->
    <div class="polaris-loading" id="loadingScreen">
        <canvas class="polaris-loading-stars" id="loadingStars"></canvas>
        <div class="polaris-loading-content">
            <div class="polaris-loading-orb">
                <div class="polaris-orb-ring r1"></div>
                <div class="polaris-orb-ring r2"></div>
                <div class="polaris-orb-ring r3"></div>
                <div class="polaris-orb-core">
                    <img class="polaris-orb-star" src="../images/flashcards/cursor-star-cyan.png" alt="">
                </div>
            </div>
            <div class="polaris-loading-title">Generando tu sesión de estudio</div>
            <div class="polaris-loading-subtitle" id="loadingSubtitle">Analizando tu contenido...</div>
            <div class="loading-progress-bar">
                <div class="loading-progress-fill" id="loadingProgressFill"></div>
            </div>
            <div class="loading-steps" id="loadingSteps"></div>
        </div>
    </div>

    <!-- ================================================================
         PANTALLA DE RESULTADOS (visible después de generar)
    ================================================================ -->
    <main class="content" id="mainContent" style="display:none;">
        <canvas id="starsCanvas"></canvas>

        <!-- Header de la sesión -->
        <div class="se-header">
            <div class="se-header-left">
                <a href="../pages/modo-estudio.html" class="se-back-link">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <div>
                    <div class="se-title" id="seTitle">Sesión de Estudio</div>
                    <div class="se-meta" id="seMeta">4 tipos de contenido generados</div>
                </div>
            </div>
            <div class="se-session-badge">
                <i class="fas fa-check-circle"></i> Listo
            </div>
        </div>

        <!-- Tabs de navegación -->
        <div class="se-tabs" id="seTabs"></div>

        <!-- Contenido de cada tab -->
        <div class="se-panels" id="sePanels"></div>
    </main>

    <!-- Fullscreen overlay para esquemas -->
    <div class="fs-overlay" id="fsOverlay">
        <div class="fs-header">
            <button class="fs-close-btn" onclick="closeFullscreen()">
                <i class="fas fa-times"></i> Cerrar
            </button>
            <div class="fs-title" id="fsTitle">Esquema</div>
            <div class="fs-zoom">
                <button onclick="fsZoom(-0.15)"><i class="fas fa-search-minus"></i></button>
                <span id="fsZoomLevel">100%</span>
                <button onclick="fsZoom(0.15)"><i class="fas fa-search-plus"></i></button>
                <button onclick="fsZoomReset()"><i class="fas fa-compress-arrows-alt"></i></button>
            </div>
        </div>
        <div class="fs-body" id="fsBody"></div>
    </div>

    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Listo</span>
    </div>

    <script src="../js/components.js"></script>
    <script>
    // ================================================================
    // CONFIGURACIÓN DE MÓDULOS
    // ================================================================
    const MODULE_CONFIG = {
        flashcards: {
            label:    'Flashcards',
            icon:     'fa-layer-group',
            color:    '#2dd4bf',
            studyUrl: '../pages/flashcards.html',
            btnLabel: 'Estudiar flashcards',
            btnIcon:  'fa-play'
        },
        esquemas: {
            label:    'Esquema',
            icon:     'fa-project-diagram',
            color:    '#8b5cf6',
            studyUrl: null, // se renderiza aquí directamente
            btnLabel: 'Ver esquema completo',
            btnIcon:  'fa-expand'
        },
        examenes: {
            label:    'Examen',
            icon:     'fa-file-signature',
            color:    '#f59e0b',
            studyUrl: null, // depende del tipo (quiz o expert_exam)
            btnLabel: 'Iniciar examen',
            btnIcon:  'fa-bolt'
        },
        resumenes: {
            label:    'Resumen',
            icon:     'fa-file-alt',
            color:    '#ec4899',
            studyUrl: null, // se muestra inline
            btnLabel: 'Leer completo',
            btnIcon:  'fa-book-open'
        }
    };

    let flow    = null;
    let results = null;
    let activeTab = null;

    // ================================================================
    // FLOW MANAGER
    // ================================================================
    function getFlow() { return JSON.parse(sessionStorage.getItem('modoEstudioFlow') || 'null'); }

    // ================================================================
    // INIT — empieza en pantalla de carga, luego llama al servlet
    // ================================================================
    document.addEventListener('DOMContentLoaded', async () => {
        flow = getFlow();

        // Si viene desde favoritos/historial, mostrar directo sin generar
        const fromHistorial = sessionStorage.getItem('fromHistorial');
        if (fromHistorial === 'true') {
            sessionStorage.removeItem('fromHistorial');
            results = JSON.parse(sessionStorage.getItem('studyResults') || '{}');
            if (!flow) flow = { userId: null, options: Object.keys(results), configs: {} };
            // Ocultar loading y mostrar resultados directo
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            initResultStars();
            buildUI(flow, results);
            return;
        }

        if (!flow || !flow.userId) {
            window.location.href = '../pages/modo-estudio.html';
            return;
        }

        // ─── Si ya hay resultados generados, mostrarlos directo ───
        const cachedResults = sessionStorage.getItem('studyResults');
        if (cachedResults) {
            try {
                results = JSON.parse(cachedResults);
                // Verificar que los resultados tengan datos válidos
                const hasData = flow.options.some(o => results[o] && !results[o].error);
                if (hasData) {
                    document.getElementById('loadingScreen').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                    initResultStars();
                    buildUI(flow, results);
                    return;
                }
            } catch(e) {
                // Si el JSON es inválido, regenerar
                sessionStorage.removeItem('studyResults');
            }
        }

        initLoadingStars();
        renderLoadingSteps(flow.options);

        try {
            results = await generateSession(flow);
            sessionStorage.setItem('studyResults', JSON.stringify(results));
            await simulateFinish(); // pequeña pausa visual
            showResults(flow, results);
        } catch (err) {
            console.error('Error generando sesión:', err);
            showError(err.message);
        }
    });

    // ================================================================
    // LLAMADA AL SERVLET
    // ================================================================
    async function generateSession(flow) {
        let requestInit;

        if (flow.dataType === 'file' && flow.fileBase64) {
            // Reconstruir archivo desde base64 y enviar como multipart
            const [meta, data] = flow.fileBase64.split(',');
            const mime = meta.match(/:(.*?);/)[1];
            const binary = atob(data);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const blob = new Blob([bytes], { type: mime });

            const formData = new FormData();
            formData.append('file',    blob, flow.fileName || 'archivo');
            formData.append('userId',  flow.userId);
            formData.append('options', JSON.stringify(flow.options));
            formData.append('configs', JSON.stringify(flow.configs || {}));
            requestInit = { method: 'POST', body: formData };
        } else {
            requestInit = {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({
                    userId:  flow.userId,
                    options: flow.options,
                    text:    flow.text,
                    configs: flow.configs
                })
            };
        }

        const response = await fetch('/project-1.0-SNAPSHOT/modo-estudio/generar', requestInit);

        if (!response.ok) throw new Error(`Error del servidor: ${response.status}`);
        const data = await response.json();
        if (!data.success) throw new Error(data.error || 'Error al generar contenido');
        return data.results;
    }

    // ================================================================
    // PANTALLA DE CARGA
    // ================================================================
    const STEP_LABELS = {
        flashcards: { label: 'Generando flashcards',  icon: 'fa-layer-group'    },
        esquemas:   { label: 'Creando esquema',        icon: 'fa-project-diagram'},
        examenes:   { label: 'Preparando examen',      icon: 'fa-file-signature' },
        resumenes:  { label: 'Redactando resumen',     icon: 'fa-file-alt'       }
    };

    function renderLoadingSteps(options) {
        const container = document.getElementById('loadingSteps');
        container.innerHTML = options.map(opt => `
            <div class="loading-step" id="lstep-${opt}">
                <div class="loading-step-icon"><i class="fas ${STEP_LABELS[opt]?.icon || 'fa-star'}"></i></div>
                <div class="loading-step-label">${STEP_LABELS[opt]?.label || opt}</div>
                <div class="loading-step-status" id="lstatus-${opt}">
                    <div class="loading-dot-spin"></div>
                </div>
            </div>
        `).join('');

        // Animar los pasos uno por uno
        let delay = 0;
        options.forEach(opt => {
            setTimeout(() => {
                document.getElementById('lstep-' + opt)?.classList.add('active');
                const subtitles = { flashcards:'Creando tarjetas de estudio...', esquemas:'Construyendo el esquema...', examenes:'Formulando las preguntas...', resumenes:'Redactando el resumen...' };
                document.getElementById('loadingSubtitle').textContent = subtitles[opt] || 'Procesando...';
                // Actualizar barra de progreso
                const pct = Math.round(((options.indexOf(opt) + 1) / options.length) * 85);
                document.getElementById('loadingProgressFill').style.width = pct + '%';
            }, delay);
            delay += 1800;
        });
    }

    function simulateFinish() {
        return new Promise(resolve => {
            document.getElementById('loadingSubtitle').textContent = '¡Todo listo!';
            document.getElementById('loadingProgressFill').style.width = '100%';
            // Marcar todos como completos
            document.querySelectorAll('.loading-step').forEach(s => {
                s.classList.add('done');
                const id = s.id.replace('lstep-', '');
                const st = document.getElementById('lstatus-' + id);
                if (st) st.innerHTML = '<i class="fas fa-check" style="color:#2dd4bf"></i>';
            });
            setTimeout(resolve, 800);
        });
    }

    function showError(msg) {
        document.getElementById('loadingSubtitle').textContent = 'Error: ' + msg;
        document.getElementById('loadingProgressFill').style.background = '#ef4444';
    }

    // ================================================================
    // PANTALLA DE RESULTADOS
    // ================================================================
    function showResults(flow, results) {
        // Ocultar loading, mostrar resultados
        document.getElementById('loadingScreen').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            initResultStars();
            buildUI(flow, results);
        }, 400);
    }

    function buildUI(flow, results) {
        // Header
        const successCount = flow.options.filter(o => results[o] && !results[o].error).length;
        document.getElementById('seTitle').textContent = results[flow.options[0]]?.title || 'Sesión de Estudio';
        document.getElementById('seMeta').textContent = `${successCount} ${successCount === 1 ? 'tipo generado' : 'tipos generados'} correctamente`;

        // Tabs
        const tabsEl   = document.getElementById('seTabs');
        const panelsEl = document.getElementById('sePanels');
        tabsEl.innerHTML = '';
        panelsEl.innerHTML = '';

        let firstTab = null;
        flow.options.forEach(opt => {
            const cfg = MODULE_CONFIG[opt];
            if (!cfg) return;
            const hasError = results[opt]?.error;

            // Tab
            const tab = document.createElement('div');
            tab.className = 'se-tab';
            tab.id = 'tab-' + opt;
            tab.innerHTML = `
                <i class="fas ${cfg.icon}"></i>
                <span>${cfg.label}</span>
                ${hasError ? '<span class="se-tab-err"><i class="fas fa-exclamation"></i></span>' : ''}
            `;
            tab.onclick = () => switchTab(opt);
            tab.style.setProperty('--tab-color', cfg.color);
            tabsEl.appendChild(tab);

            // Panel
            const panel = document.createElement('div');
            panel.className = 'se-panel';
            panel.id = 'panel-' + opt;
            panel.innerHTML = hasError
                ? buildErrorPanel(opt, results[opt].error)
                : buildPanel(opt, results[opt], flow.configs[opt]);
            panelsEl.appendChild(panel);

            if (!firstTab) firstTab = opt;
        });

        if (firstTab) switchTab(firstTab);
    }

    function switchTab(opt) {
        activeTab = opt;
        document.querySelectorAll('.se-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.se-panel').forEach(p => p.classList.remove('active'));
        document.getElementById('tab-' + opt)?.classList.add('active');
        document.getElementById('panel-' + opt)?.classList.add('active');
    }

    // ================================================================
    // BUILDERS DE PANELES
    // ================================================================
    function buildPanel(opt, data, config) {
        switch (opt) {
            case 'flashcards': return buildFlashcardsPanel(data);

            case 'resumenes':  return buildResumenPanel(data);

        }
    }

    function buildErrorPanel(opt, error) {

            <div class="se-error-panel">

                <div class="se-error-title">Error generando ${MODULE_CONFIG[opt]?.label}</div>
                <div class="se-error-msg">${error}</div>
                <button class="se-action-btn secondary" onclick="window.location.href='../pages/modo-estudio.html'">
                    <i class="fas fa-redo"></i> Volver a intentar
                </button>
            </div>
        `;
    }

    // — Flashcards —

    }

    // — Esquemas —

                arrows+=`<polygon points="${px+tx*2},${py+ty*2} ${px+nx*1.5},${py+ny*1.5} ${px-nx*1.5},${py-ny*1.5}" fill="${col}" opacity="0.8"/>`;
            });const lblR=52;let phasesHTML='';
            fases.forEach((f,i)=>{const col=colors[i%colors.length],ma=(2*Math.PI*(i+0.5)/n)-Math.PI/2,cosA=Math.cos(ma),sinA=Math.sin(ma),lx=50+lblR*cosA,ly=50+lblR*sinA,subs=(f.children||[]).slice(0,4);
                let infoPos='';if(Math.abs(cosA)>=Math.abs(sinA)){infoPos=cosA>0?'left:calc(100% + 32px);top:50%;transform:translateY(-50%);':'right:calc(100% + 32px);top:50%;transform:translateY(-50%);';}
                else{infoPos=sinA>0?'top:calc(100% + 26px);left:50%;transform:translateX(-50%);':'bottom:calc(100% + 26px);left:50%;transform:translateX(-50%);';}
                let rows=subs.length>0?subs.map((s,si)=>{const dt=getDetail(s);const arrow=dt?'<span class="sub-arrow">\u25B8</span>':'';const click=dt?`onclick="event.stopPropagation();subToggle('cySD${i}_${si}')"`:'';const det=dt?`<div class="s-item-detail" id="cySD${i}_${si}">${escSvg(dt)}</div>`:'';
                    return `<div class="s-item" style="border-left-color:${col}" ${click}>${escSvg(s.label)}${arrow}</div>${det}`;}).join(''):`<div class="s-item" style="border-left-color:${col};color:rgba(255,255,255,0.3);font-style:italic;cursor:default">Sin detalles</div>`;
                phasesHTML+=`<div class="cy-phase" style="left:${lx}%;top:${ly}%;"><div class="cy-lbl" id="cyL${i}" style="color:${col}" onclick="cyToggle(${i})">${escSvg(f.label)}</div><div class="cy-info" id="cyI${i}" style="border:1.5px solid ${col};${infoPos}"><div class="cy-info-hd"><span style="background:${col}"></span>${escSvg(f.label)}</div>${rows}<div class="cy-info-ft">Fase ${i+1} de ${n}</div></div></div>`;
            });return `<div class="cy-outer"><div class="cy-ring-area"><svg class="cy-svg" viewBox="0 0 100 100">${arcs}${arrows}</svg><div class="cy-center-ico">\u21BB</div>${phasesHTML}</div></div>`;
        }

        let schemaHTML;
        switch(tipo) {
            case 'conceptual':   schemaHTML = renderConceptual(root);   break;
            case 'timeline':     schemaHTML = renderTimeline(root);     break;
            case 'causa-efecto': schemaHTML = renderCausaEfecto(root);  break;
            case 'ciclico':      schemaHTML = renderCiclico(root);      break;
            default:             schemaHTML = renderJerarquico(root);   break;
        }

        return `
            <div class="se-panel-inner">
                <div class="se-panel-stats">
                    <div class="se-stat"><span class="se-stat-val">${tipoLabels[tipo] || tipo}</span><span class="se-stat-lbl">tipo</span></div>
                </div>
                <div class="se-tree-container">
                    ${root ? schemaHTML : '<p style="color:rgba(255,255,255,0.4)">Sin datos</p>'}
                </div>
                <div class="se-actions">
                    <button class="se-action-btn primary" onclick="openFullscreen()">
                        <i class="fas fa-expand"></i> Ver pantalla completa
                    </button>
                    <button class="se-fav-btn" id="favBtn-esquemas" onclick="toggleFavorite('esquemas')">
                        <i class="far fa-heart"></i> Guardar
                    </button>
                </div>
            </div>
        `;
    }
    function countNodes(node) {
        if (!node) return 0;
        return 1 + (node.children || []).reduce((s, c) => s + countNodes(c), 0);
    }

    // — Resumen —
    function buildResumenPanel(data) {
        const sections = data.sections || [];
        const keywords = data.keywords || [];

        const previewSections = sections.slice(0, 2).map(sec => `
            <div class="se-resumen-section-preview">
                <div class="se-resumen-section-num">${sec.number || ''}</div>
                <div class="se-resumen-section-body">
                    <div class="se-resumen-section-heading">${sec.heading || ''}</div>
                    <div class="se-resumen-section-text">${sec.body ? sec.body.substring(0, 120) + (sec.body.length > 120 ? '…' : '') : ''}</div>

            </div>
        `).join('');

        const kwTags = keywords.slice(0, 5).map(kw =>
            `<span class="se-keyword-tag">${kw}</span>`
        ).join('');

        const readMins = data.readingMinutes || Math.max(1, Math.round(sections.length * 1.5));

        return `
            <div class="se-panel-inner">
                <div class="se-panel-stats">

                    <div class="se-stat"><span class="se-stat-val">${keywords.length}</span><span class="se-stat-lbl">palabras clave</span></div>

                </div>
                ${previewSections}

                ${kwTags ? `<div class="se-keywords-row" style="display:flex;flex-wrap:wrap;gap:6px;margin:0.75rem 0;">${kwTags}</div>` : ''}

                    <button class="se-action-btn primary" onclick="goStudy('resumenes')">

    // ================================================================
    // ACCIONES
    // ================================================================
    function goStudy(opt) {
        if (opt === 'examenes') {
            const tipo = flow?.configs?.examenes?.tipo;
            window.location.href = tipo === 'expert_exam'
                ? '../pages/examen-experto.html'
                : '../pages/examen-quiz.html';
            return;
        }
        if (opt === 'resumenes') {
            const id = results?.resumenes?.id;
            window.location.href = '../pages/resumenes.html' + (id ? '?id=' + id : '');
            return;
        }
        const routes = {
            flashcards: '../pages/flashcards.html',
            esquemas:   '../pages/seleccion-esquema.html'
        };
        if (routes[opt]) window.location.href = routes[opt];
    }

    // ================================================================
    // FULLSCREEN ESQUEMA
    // ================================================================
    let fsScale = 1;
    function openFullscreen(){var tc=document.querySelector('.se-tree-container');if(!tc)return;var body=document.getElementById('fsBody');while(tc.firstChild)body.appendChild(tc.firstChild);tc.setAttribute('data-fs','1');var w=body.querySelector('.se-schema-svg-wrap');if(w){w.style.maxWidth='95vw';w.style.width='95vw';}var cy=body.querySelector('.cy-outer');if(cy){cy.style.maxWidth='90vw';cy.style.padding='60px';}var cm=body.querySelector('.cm-wrap');if(cm){cm.style.maxWidth='80vh';}var tl=body.querySelector('.tl-wrap');if(tl){tl.style.maxWidth='95vw';}var tipo=flow?.configs?.esquemas?.tipo||'esquema';var labels={jerarquico:'Jerárquico',conceptual:'Conceptual',timeline:'Línea del tiempo','causa-efecto':'Causa y efecto',ciclico:'Cíclico'};document.getElementById('fsTitle').textContent=labels[tipo]||'Esquema';fsScale=1;document.getElementById('fsZoomLevel').textContent='100%';document.getElementById('fsOverlay').classList.add('active');document.body.style.overflow='hidden';}
    function closeFullscreen(){var body=document.getElementById('fsBody'),tc=document.querySelector('.se-tree-container[data-fs]');if(tc){while(body.firstChild)tc.appendChild(body.firstChild);tc.removeAttribute('data-fs');var w=tc.querySelector('.se-schema-svg-wrap');if(w){w.style.maxWidth='';w.style.width='';w.style.transform='';}var cy=tc.querySelector('.cy-outer');if(cy){cy.style.maxWidth='';cy.style.padding='';}var cm=tc.querySelector('.cm-wrap');if(cm)cm.style.maxWidth='';var tl=tc.querySelector('.tl-wrap');if(tl){tl.style.maxWidth='';tl.style.transform='';}}document.getElementById('fsOverlay').classList.remove('active');document.body.style.overflow='';}
    function fsZoom(delta){fsScale=Math.max(0.3,Math.min(3,fsScale+delta));var el=document.querySelector('#fsBody .se-schema-svg-wrap')||document.querySelector('#fsBody .tl-wrap')||document.querySelector('#fsBody .cm-wrap')||document.querySelector('#fsBody .cy-outer');if(el)el.style.transform='scale('+fsScale+')';document.getElementById('fsZoomLevel').textContent=Math.round(fsScale*100)+'%';}
    function fsZoomReset(){fsScale=1;var el=document.querySelector('#fsBody .se-schema-svg-wrap')||document.querySelector('#fsBody .tl-wrap')||document.querySelector('#fsBody .cm-wrap')||document.querySelector('#fsBody .cy-outer');if(el)el.style.transform='scale(1)';document.getElementById('fsZoomLevel').textContent='100%';}
    // Cerrar con Escape
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && document.getElementById('fsOverlay').classList.contains('active')) {
            closeFullscreen();
        }
    });

    // Estado de favoritos por opción
    const favoriteState = {};

    async function toggleFavorite(opt) {
        const contentId = results?.[opt]?.id;
        if (!contentId) { showToast('Contenido no disponible'); return; }

        const btn = document.getElementById('favBtn-' + opt);
        const isCurrentlyFav = favoriteState[opt] || false;
        const newState = !isCurrentlyFav;

        try {
            const response = await fetch('../api/favoritos', {
                method:  'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-User-Id': flow.userId
                },
                body: JSON.stringify({
                    contentId:  contentId,
                    isFavorite: newState
                })
            });

            const data = await response.json();
            if (data.success) {
                favoriteState[opt] = newState;
                if (btn) {
                    if (newState) {
                        btn.classList.add('active', 'animating');
                        btn.innerHTML = '<i class="fas fa-heart"></i> Guardado';
                        createHeartSparkles(btn);
                        setTimeout(() => btn.classList.remove('animating'), 500);
                    } else {
                        btn.classList.remove('active');
                        btn.innerHTML = '<i class="far fa-heart"></i> Guardar';
                    }
                }
                showToast(newState ? 'Guardado en favoritos' : 'Eliminado de favoritos');
            } else {
                showToast('Error al actualizar favorito');
                console.error('[Favorito]', data.error);
            }
        } catch (error) {
            console.error('[Favorito] Error de conexión:', error);
            showToast('Error de conexión');
        }
    }

    function createHeartSparkles(btn) {
        const container = document.createElement('div');
        container.className = 'sparkle-container';
        btn.appendChild(container);
        const angles = [0, 45, 90, 135, 180, 225, 270, 315];
        angles.forEach(angle => {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            const distance = 25 + Math.random() * 15;
            const rad = (angle * Math.PI) / 180;
            const x = Math.cos(rad) * distance;
            const y = Math.sin(rad) * distance;
            sparkle.style.setProperty('--sparkle-end', `translate(${x}px, ${y}px)`);
            container.appendChild(sparkle);
        });
        setTimeout(() => container.remove(), 700);
    }

    // ================================================================
    // TOAST
    // ================================================================
    function showToast(msg) {
        const t = document.getElementById('toast');
        document.getElementById('toastMessage').textContent = msg;
        t.classList.add('show');
        clearTimeout(t._t);
        t._t = setTimeout(() => t.classList.remove('show'), 3000);
    }

    // ================================================================
    // STARS — loading screen
    // ================================================================
    function initLoadingStars() {
        const canvas = document.getElementById('loadingStars');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const stars = Array.from({length:200}, () => ({
            x:Math.random()*canvas.width, y:Math.random()*canvas.height,
            size:Math.random()*2+0.2, speedX:(Math.random()-0.5)*0.08, speedY:(Math.random()-0.5)*0.08,
            opacity:Math.random()*0.5+0.1, opacityChange:(Math.random()-0.5)*0.01,
            color:['#ffffff','#ffe9c4','#d4f1ff','#c4b5fd'][Math.floor(Math.random()*4)]
        }));
        function animate() {
            if (!document.getElementById('loadingStars')) return;
            ctx.clearRect(0,0,canvas.width,canvas.height);
            stars.forEach(s => {
                s.x+=s.speedX; s.y+=s.speedY;
                if(s.x<0)s.x=canvas.width; if(s.x>canvas.width)s.x=0;
                if(s.y<0)s.y=canvas.height; if(s.y>canvas.height)s.y=0;
                s.opacity+=s.opacityChange; if(s.opacity<=0.05||s.opacity>=0.7)s.opacityChange*=-1;
                ctx.beginPath(); ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
                ctx.fillStyle=s.color; ctx.globalAlpha=s.opacity; ctx.fill();
            });
            ctx.globalAlpha=1; requestAnimationFrame(animate);
        }
        animate();
    }

    function initResultStars() {
        const canvas = document.getElementById('starsCanvas');
        const ctx = canvas.getContext('2d'), content = document.getElementById('mainContent');
        function resize() { canvas.width = content.offsetWidth; canvas.height = Math.max(content.scrollHeight, window.innerHeight); }
        resize();
        const stars = Array.from({length:120}, () => ({
            x:Math.random()*canvas.width, y:Math.random()*canvas.height,
            size:Math.random()*1.8+0.2, speedX:(Math.random()-0.5)*0.08, speedY:(Math.random()-0.5)*0.08,
            opacity:Math.random()*0.35+0.05, opacityChange:(Math.random()-0.5)*0.01,
            color:['#ffffff','#c4b5fd','#aaddff'][Math.floor(Math.random()*3)]
        }));
        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            stars.forEach(s => {
                s.x+=s.speedX; s.y+=s.speedY;
                if(s.x<0)s.x=canvas.width; if(s.x>canvas.width)s.x=0;
                if(s.y<0)s.y=canvas.height; if(s.y>canvas.height)s.y=0;
                s.opacity+=s.opacityChange; if(s.opacity<=0.02||s.opacity>=0.5)s.opacityChange*=-1;
                ctx.beginPath(); ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
                ctx.fillStyle=s.color; ctx.globalAlpha=s.opacity; ctx.fill();
            });
            ctx.globalAlpha=1; requestAnimationFrame(animate);
        }
        animate(); window.addEventListener('resize',resize);
    }

    function subToggle(id){var el=document.getElementById(id);if(el)el.classList.toggle('on');}

    // Floating tooltip for jerárquico + causa-efecto
    var _floatTimer = null;
    var _floatCurrent = -1;
    var _floatType = '';

    function floatShow(evt, idx, type) {
        if (_floatTimer) { clearTimeout(_floatTimer); _floatTimer = null; }
        var panel = document.getElementById(type === 'jq' ? 'floatJQ' : 'floatCE');
        if (!panel) return;
        if (_floatCurrent === idx && _floatType === type) return;
        try {
            var items = JSON.parse(panel.getAttribute('data-items'));
            var item = items[idx]; if (!item) return;
            var wrapRect = panel.parentElement.getBoundingClientRect();
            var targetRect = evt.target.getBoundingClientRect();
            var isCE = type === 'ce';

            function doOpen() {
                if (isCE) {
                    var textCenterY = targetRect.top - wrapRect.top + targetRect.height / 2;
                    var rightFromWrap = wrapRect.width - (targetRect.left - wrapRect.left) + 6;
                    panel.style.left = 'auto';
                    panel.style.right = rightFromWrap + 'px';
                    panel.style.top = textCenterY + 'px';
                    panel.style.transform = 'translateY(-50%)';
                } else {
                    var l = targetRect.left - wrapRect.left + targetRect.width / 2 - 160;
                    var t = targetRect.bottom - wrapRect.top + 4;
                    l = Math.max(5, Math.min(l, wrapRect.width - 350));
                    panel.style.right = 'auto';
                    panel.style.transform = '';
                    panel.style.left = l + 'px';
                    panel.style.top = t + 'px';
                }
                var titleEl = panel.querySelector('.fd-card .fd-title');
                var bodyEl = panel.querySelector('.fd-card .fd-body');
                if (titleEl) titleEl.textContent = item.label;
                if (bodyEl) bodyEl.textContent = item.detail || 'Sin detalles adicionales';
                if (item.col) panel.style.setProperty('--ce-col', item.col);
                void panel.offsetHeight;
                panel.classList.add('on');
                _floatCurrent = idx;
                _floatType = type;
            }

            if (_floatCurrent >= 0) {
                panel.classList.remove('on');
                _floatCurrent = -1;
                _floatTimer = setTimeout(doOpen, 380);
            } else {
                doOpen();
            }
        } catch(e) { console.error('floatShow:', e); }
    }

    function floatHide(type) {
        if (_floatTimer) { clearTimeout(_floatTimer); _floatTimer = null; }
        var panel = document.getElementById(type === 'jq' ? 'floatJQ' : 'floatCE');
        if (panel) panel.classList.remove('on');
        _floatCurrent = -1;
        _floatType = '';
    }

    // Conceptual
    var _cmOpen=-1;
    function cmToggle(i){if(_cmOpen===i){var n=document.getElementById('cmN'+i);if(n)n.classList.remove('open');_cmOpen=-1;}else{document.querySelectorAll('.cm-node').forEach(function(el){el.classList.remove('open')});var n=document.getElementById('cmN'+i);if(n)n.classList.add('open');_cmOpen=i;}}
    function cmHL(i,on){var l=document.getElementById('cmL'+i);if(l){if(on)l.classList.add('glow');else l.classList.remove('glow');}}

    // Cíclico
    var _cyOpen=-1;
    function cyToggle(i){document.querySelectorAll('.cy-arc').forEach(function(a){a.classList.remove('on')});document.querySelectorAll('.cy-lbl').forEach(function(l){l.classList.remove('on');l.style.borderColor='transparent'});document.querySelectorAll('.cy-info').forEach(function(p){p.classList.remove('on')});if(_cyOpen===i){_cyOpen=-1;return;}var arc=document.getElementById('cyA'+i),lbl=document.getElementById('cyL'+i),inf=document.getElementById('cyI'+i);if(arc)arc.classList.add('on');if(lbl){lbl.classList.add('on');lbl.style.borderColor=lbl.style.color;}if(inf)inf.classList.add('on');_cyOpen=i;}

    // Timeline
    var _tlOpen=-1;
    function tlToggle(i){document.querySelectorAll('.tl-detail').forEach(function(el){el.classList.remove('on')});document.querySelectorAll('.tl-card').forEach(function(el){el.classList.remove('active')});if(_tlOpen===i){_tlOpen=-1;return;}var d=document.getElementById('tlD'+i);if(d)d.classList.add('on');var cols=document.querySelectorAll('.tl-col');if(cols[i]){var c=cols[i].querySelector('.tl-card');if(c)c.classList.add('active');}  _tlOpen=i;}
