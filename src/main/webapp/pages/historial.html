<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi ProfesorIA - Historial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles-shared.css">
    <link rel="stylesheet" href="../css/historial.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="historial">

    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <main class="content">
        <!-- Pantalla de carga Polaris (solo cubre el content) -->
        <div class="polaris-loading" id="historialLoading">
            <canvas class="polaris-loading-stars"></canvas>
            <div class="polaris-loading-content">
                <div class="polaris-loading-orb">
                    <div class="polaris-orb-ring r1"></div>
                    <div class="polaris-orb-ring r2"></div>
                    <div class="polaris-orb-ring r3"></div>
                    <div class="polaris-orb-core">
                        <img class="polaris-orb-star" src="../images/flashcards/cursor-star-cyan.png" alt="">
                    </div>
                </div>
                <div class="polaris-loading-title">Cargando</div>
                <div class="polaris-loading-subtitle" id="historialLoadingSub">Obteniendo datos...</div>
            </div>
        </div>

        <div class="page-header">
            <div class="page-header-left">
                <h2 class="page-title">
                    <i class="fas fa-clock-rotate-left"></i>
                    Historial
                </h2>
                <p class="page-subtitle">Revisa tu actividad reciente</p>
            </div>
        </div>

        <div class="controls-bar">
            <div class="controls-left">
                <div class="filter-tabs">
                    <button class="filter-tab active" onclick="setFilter('recientes', this)">Recientes</button>
                    <button class="filter-tab" onclick="setFilter('tipo', this)">Por tipo</button>
                </div>
                <div class="date-picker-wrapper">
                    <i class="fas fa-calendar-alt"></i>
                    <input type="date" id="datePicker">
                    <button class="btn-clear-date" id="btnClearDate" onclick="clearDate()" title="Quitar filtro de fecha">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            <div class="historial-search">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar en tu historial...">
            </div>
        </div>

        <!-- Lista dinámica — historial.js rellena aquí -->
        <div id="historyContainer"></div>

        <div class="empty-state" id="emptyState" style="display:none;">
            <i class="fas fa-clock-rotate-left"></i>
            <h3>No se encontraron resultados</h3>
            <p>Intenta con otro nombre o selecciona otra fecha en el calendario.</p>
        </div>

    </main>

    <!-- Modal: eliminar un ítem -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal">
            <div class="modal-icon warning">
                <i class="fas fa-trash-alt"></i>
            </div>
            <h3>¿Eliminar del historial?</h3>
            <p>¿Estás seguro de eliminar <span class="highlight" id="deleteItemName"></span> de tu historial?</p>
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeDeleteModal()">Cancelar</button>
                <button class="modal-btn confirm" onclick="confirmDelete()">Eliminar</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage"></span>
    </div>

    <script src="../js/components.js"></script>
    <script src="../js/historial.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof PolarisLoading !== 'undefined')
            PolarisLoading.initStars(document.querySelector('#historialLoading .polaris-loading-stars'));
    });
    // Fallback: si el JS de la página falla, ocultar loading después de 8s
    setTimeout(function() {
        var el = document.getElementById('historialLoading');
        if (el) { el.style.opacity='0'; el.style.pointerEvents='none'; setTimeout(function(){el.remove()},500); }
    }, 8000);
    </script>
</body>
</html>
